name: FCAE
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: iphoneos
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: 'NO'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_OBJC_ARC: 'YES'
    CODE_SIGNING_ALLOWED: 'NO'
    CODE_SIGNING_REQUIRED: 'NO'
    ENABLE_BITCODE: 'NO'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)
      - $(SRCROOT)/../src_cpp
      - $(SRCROOT)/../src_cpp/imgui
      - $(SRCROOT)/../src_cpp/imgui/backends
      - $(SRCROOT)/../core/fcae-ffi/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/aarch64-apple-ios/release
    OTHER_LDFLAGS: ['$(inherited)', '-lfcae_ffi', '-lc++', '-lresolv', '-lz', '-liconv', '-lsqlite3']
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    FCAE_APP_GROUP: group.com.fc.fcaevpn
    FCAE_BUNDLE_ID: com.fc.fcaevpn
    TARGETED_DEVICE_FAMILY: '1,2'
    GCC_PREPROCESSOR_DEFINITIONS: ['$(inherited)', 'FCAE_IOS=1', '$(FCAE_CHANNEL_FLAGS)', 'FCAE_VERSION=\"$(FCAE_RELEASE_VERSION)\"']
    FCAE_RELEASE_VERSION: '1.0.0'
    FCAE_CHANNEL_FLAGS: ''
targets:
  FCAE:
    type: application
    platform: iOS
    sources:
      - App.mm
      - VPN.mm
      - Config.mm
      - Assets.xcassets
      - ../src_cpp/ui_render.cpp
      - ../src_cpp/imgui/imgui.cpp
      - ../src_cpp/imgui/imgui_draw.cpp
      - ../src_cpp/imgui/imgui_tables.cpp
      - ../src_cpp/imgui/imgui_widgets.cpp
      - ../src_cpp/imgui/backends/imgui_impl_metal.mm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FCAE_BUNDLE_ID)
        PRODUCT_NAME: FCAE
        INFOPLIST_FILE: App-Info.plist
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PacketTunnel
        embed: true
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Foundation.framework
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel.mm, Config.mm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FCAE_BUNDLE_ID).PacketTunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: Tunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
    dependencies:
      - sdk: Foundation.framework
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
schemes:
  FCAE:
    build:
      targets:
        FCAE: all
