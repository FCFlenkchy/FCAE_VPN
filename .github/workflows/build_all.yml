name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'pre-release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  actions: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x64
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DAETHER_TARGET=LINUX_X64

          - target: x86_64-pc-windows-gnu
            name: windows-x64
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_SYSTEM_NAME=Windows
              -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
              -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
              -DAETHER_TARGET=WIN_X64

          - target: aarch64-linux-android
            name: android-arm64-v8a
            cmake_args: "-DAETHER_TARGET=ANDROID_ARM64"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ensure submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: ensure hev-socks5-tunnel submodules
        run: |
          if [ -f hev-socks5-tunnel/.gitmodules ]; then
            echo "Initializing hev-socks5-tunnel submodules..."
            cd hev-socks5-tunnel
            git init
            git submodule sync --recursive 2>/dev/null || true
            git submodule update --init --recursive --depth 1 2>/dev/null || true
            cd ..
          fi
        continue-on-error: true

      - name: patch hev-socks5-tunnel submodules for MinGW cross-compile
        if: matrix.name == 'windows-x64'
        run: |
          # Apply Windows compatibility patches to submodule files
          # that git submodule update overwrites with upstream code.
          cd hev-socks5-tunnel

          # --- hev-task-system/include/hev-task.h (poll.h) ---
          sed -i 's|#include <poll.h>|#ifdef _WIN32\n#include <winsock2.h>\n#else\n#include <poll.h>\n#endif|' third-part/hev-task-system/include/hev-task.h

          # --- hev-task-system/include/hev-task-io.h (sys/uio.h) ---
          sed -i 's|#include <sys/uio.h>|#ifdef _WIN32\n#include <io.h>\nstruct iovec { void *iov_base; size_t iov_len; };\n#else\n#include <sys/uio.h>\n#endif|' third-part/hev-task-system/include/hev-task-io.h

          # --- hev-task-system/include/hev-task-io-socket.h (sys/socket.h) ---
          sed -i 's|#include <sys/socket.h>|#ifdef _WIN32\n#include <winsock2.h>\n#include <ws2tcpip.h>\n#else\n#include <sys/socket.h>\n#endif|' third-part/hev-task-system/include/hev-task-io-socket.h
          # Patch struct msghdr for MinGW (often missing despite ws2tcpip.h)
          sed -i 's|#endif$|#endif\n#if !defined(_WS2DEF_) || defined(__MINGW32__)\nstruct msghdr { void *msg_name; int msg_namelen; struct iovec *msg_iov; size_t msg_iovlen; void *msg_control; size_t msg_controllen; int msg_flags; };\n#endif|' third-part/hev-task-system/include/hev-task-io-socket.h
          # Same for src/ copy
          sed -i 's|#include <sys/socket.h>|#ifdef _WIN32\n#include <winsock2.h>\n#include <ws2tcpip.h>\n#else\n#include <sys/socket.h>\n#endif|' third-part/hev-task-system/src/lib/io/socket/hev-task-io-socket.h
          sed -i 's|#endif$|#endif\n#if !defined(_WS2DEF_) || defined(__MINGW32__)\nstruct msghdr { void *msg_name; int msg_namelen; struct iovec *msg_iov; size_t msg_iovlen; void *msg_control; size_t msg_controllen; int msg_flags; };\n#endif|' third-part/hev-task-system/src/lib/io/socket/hev-task-io-socket.h

          # --- hev-socks5-core/include/hev-socks5.h (netinet/in.h) ---
          sed -i 's|#include <netinet/in.h>|#ifdef _WIN32\n#include <winsock2.h>\n#include <ws2tcpip.h>\n#else\n#include <netinet/in.h>\n#endif|' src/core/include/hev-socks5.h

          # --- hev-socks5-core/include/hev-socks5-misc.h (netinet/in.h) ---
          sed -i 's|#include <netinet/in.h>|#ifdef _WIN32\n#include <winsock2.h>\n#include <ws2tcpip.h>\n#else\n#include <netinet/in.h>\n#endif|' src/core/include/hev-socks5-misc.h

          # --- hev-socks5-core/include/hev-rbtree.h (unsigned long -> uintptr_t) ---
          sed -i 's|#include <stddef.h>|#include <stddef.h>\n#include <stdint.h>|' src/core/include/hev-rbtree.h
          sed -i 's|unsigned long __parent_color|uintptr_t __parent_color|' src/core/include/hev-rbtree.h
          sed -i 's|(unsigned long)node|(uintptr_t)node|g' src/core/include/hev-rbtree.h
          sed -i 's|(unsigned long)parent|(uintptr_t)parent|g' src/core/include/hev-rbtree.h

          # --- hev-socks5-core/src/hev-socks5-logger.c (unistd.h, sys/uio.h, sys/stat.h) ---
          sed -i 's|#include <fcntl.h>|#ifdef _WIN32\n#include <io.h>\n#include <fcntl.h>\n#include <sys/stat.h>\n#include <winsock2.h>\nstruct iovec { void *iov_base; size_t iov_len; };\n#else\n#include <fcntl.h>|' src/core/src/hev-socks5-logger.c
          # The above replaces the first fcntl include; fix the rest
          sed -i '/struct iovec.*iov_len.*};/!{ /#include <unistd.h>/d }' src/core/src/hev-socks5-logger.c 2>/dev/null || true
          sed -i 's|#include <unistd.h>||' src/core/src/hev-socks5-logger.c 2>/dev/null || true
          sed -i 's|#include <sys/uio.h>||' src/core/src/hev-socks5-logger.c 2>/dev/null || true
          sed -i 's|#include <sys/stat.h>|#include <sys/stat.h>\n#endif|' src/core/src/hev-socks5-logger.c

          # --- hev-task-system/src/kern/task/hev-task-stack-mmap.c (sys/mman.h) ---
          sed -i 's|#include <unistd.h>|#ifdef _WIN32\n#include <io.h>\n#include <windows.h>\n#else\n#include <unistd.h>|' third-part/hev-task-system/src/kern/task/hev-task-stack-mmap.c
          sed -i 's|#include <sys/mman.h>|#include <sys/mman.h>\n#endif|' third-part/hev-task-system/src/kern/task/hev-task-stack-mmap.c

          # --- hev-task-system/src/lib/io/socket/hev-task-io-socket.c ---
          sed -i 's|#include <unistd.h>|#ifdef _WIN32\n#include <io.h>\n#include <winsock2.h>\n#include <ws2tcpip.h>\n#else\n#include <unistd.h>|' third-part/hev-task-system/src/lib/io/socket/hev-task-io-socket.c
          sed -i 's|#include <sys/socket.h>|#include <sys/socket.h>\n#include <sys/ioctl.h>\n#endif|' third-part/hev-task-system/src/lib/io/socket/hev-task-io-socket.c
          sed -i '/#include <sys\/ioctl.h>/,/endif/ { /sys\/ioctl.h/d }' third-part/hev-task-system/src/lib/io/socket/hev-task-io-socket.c 2>/dev/null || true
          # Fix double-include issue: remove standalone sys/ioctl.h after we've already handled it
          sed -i '/^#include <sys\/ioctl.h>$/d' third-part/hev-task-system/src/lib/io/socket/hev-task-io-socket.c

          # --- hev-task-system/src/lib/io/basic/hev-task-io.c ---
          sed -i 's|#include <fcntl.h>|#ifdef _WIN32\n#include <io.h>\n#include <winsock2.h>\n#include <ws2tcpip.h>\n#else\n#include <fcntl.h>|' third-part/hev-task-system/src/lib/io/basic/hev-task-io.c
          sed -i '/struct iovec/,+5{ /#include <unistd.h>/d }' third-part/hev-task-system/src/lib/io/basic/hev-task-io.c 2>/dev/null || true
          sed -i 's|#include <unistd.h>||' third-part/hev-task-system/src/lib/io/basic/hev-task-io.c 2>/dev/null || true
          sed -i 's|#include <sys/types.h>||' third-part/hev-task-system/src/lib/io/basic/hev-task-io.c 2>/dev/null || true
          sed -i 's|#include <sys/stat.h>||' third-part/hev-task-system/src/lib/io/basic/hev-task-io.c 2>/dev/null || true
          sed -i 's|#include <sys/ioctl.h>||' third-part/hev-task-system/src/lib/io/basic/hev-task-io.c 2>/dev/null || true
          sed -i 's|#include <sys/socket.h>|#endif|' third-part/hev-task-system/src/lib/io/basic/hev-task-io.c

          # --- hev-task-system/src/lib/io/pipe/hev-task-io-pipe.c ---
          sed -i 's|#include <unistd.h>|#ifdef _WIN32\n#include <io.h>\n#include <fcntl.h>\n#include <winsock2.h>\n#else\n#include <unistd.h>|' third-part/hev-task-system/src/lib/io/pipe/hev-task-io-pipe.c
          sed -i 's|#include <sys/ioctl.h>|#include <sys/ioctl.h>\n#endif|' third-part/hev-task-system/src/lib/io/pipe/hev-task-io-pipe.c

          # --- hev-task-system/src/lib/io/buffer/hev-circular-buffer.h ---
          sed -i 's|#include <sys/uio.h>|#ifdef _WIN32\n#include <stddef.h>\nstruct iovec { void *iov_base; size_t iov_len; };\n#else\n#include <sys/uio.h>|' third-part/hev-task-system/src/lib/io/buffer/hev-circular-buffer.h
          sed -i 's|#include <sys/types.h>|#include <sys/types.h>\n#endif|' third-part/hev-task-system/src/lib/io/buffer/hev-circular-buffer.h

          # --- hev-task-system/src/lib/io/basic/hev-task-io.h ---
          sed -i 's|#include <sys/uio.h>|#ifdef _WIN32\n#include <io.h>\n#include <stddef.h>\nstruct iovec { void *iov_base; size_t iov_len; };\n#else\n#include <sys/uio.h>|' third-part/hev-task-system/src/lib/io/basic/hev-task-io.h
          sed -i 's|#include <sys/types.h>|#include <sys/types.h>\n#endif|' third-part/hev-task-system/src/lib/io/basic/hev-task-io.h

          # --- hev-task-system/src/lib/io/socket/hev-task-io-socket.h ---
          sed -i 's|#include <sys/socket.h>|#ifdef _WIN32\n#include <winsock2.h>\n#include <ws2tcpip.h>\n#else\n#include <sys/socket.h>\n#endif|' third-part/hev-task-system/src/lib/io/socket/hev-task-io-socket.h

          # --- hev-task-system/src/kern/itc/hev-task-channel.h ---
          sed -i 's|#include <sys/types.h>|#ifdef _WIN32\n#include <stddef.h>\n#else\n#include <sys/types.h>\n#endif|' third-part/hev-task-system/src/kern/itc/hev-task-channel.h

          # --- hev-task-system/src/kern/itc/hev-task-channel-select.h ---
          sed -i 's|#include <sys/types.h>|#ifdef _WIN32\n#include <stddef.h>\n#else\n#include <sys/types.h>\n#endif|' third-part/hev-task-system/src/kern/itc/hev-task-channel-select.h

          # --- hev-task-system/src/lib/dns/hev-task-dns.h ---
          sed -i 's|#include <netdb.h>|#ifdef _WIN32\n#include <winsock2.h>\n#include <ws2tcpip.h>\n#else\n#include <netdb.h>|' third-part/hev-task-system/src/lib/dns/hev-task-dns.h
          sed -i 's|#include <sys/types.h>||' third-part/hev-task-system/src/lib/dns/hev-task-dns.h
          sed -i 's|#include <sys/socket.h>|#include <sys/socket.h>\n#endif|' third-part/hev-task-system/src/lib/dns/hev-task-dns.h

          # --- hev-task-system/src/lib/dns/hev-task-dns-proxy.h ---
          sed -i 's|#include <netdb.h>|#ifdef _WIN32\n#include <winsock2.h>\n#include <ws2tcpip.h>\n#else\n#include <netdb.h>|' third-part/hev-task-system/src/lib/dns/hev-task-dns-proxy.h
          sed -i 's|#include <sys/types.h>||' third-part/hev-task-system/src/lib/dns/hev-task-dns-proxy.h
          sed -i 's|#include <sys/socket.h>|#include <sys/socket.h>\n#endif|' third-part/hev-task-system/src/lib/dns/hev-task-dns-proxy.h

          cd ..
          echo "Submodule patches applied for Windows cross-compilation."
        continue-on-error: true

      - name: cleanup old caches
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fifteenHoursAgo = Date.now() - 15 * 60 * 60 * 1000;
            const prefixes = ['cmake-', 'gradle-', 'sccache-'];
            // Rust caches are managed by Swatinem/rust-cache — skip those.

            for (const prefix of prefixes) {
              let page = 1;
              let totalDeleted = 0;
              while (true) {
                const res = await github.rest.actions.getActionsCacheList({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  key: prefix,
                  per_page: 100,
                  page,
                });
                const caches = res.data.actions_caches || [];
                if (caches.length === 0) break;

                // Delete anything older than 7 days
                const old = caches.filter(c => new Date(c.created_at).getTime() < fifteenHoursAgo);
                // Also cap at 3 most recent per prefix
                const recent = caches.filter(c => new Date(c.created_at).getTime() >= fifteenHoursAgo);
                const excess = recent.slice(3);
                const toDelete = [...old, ...excess];

                for (const cache of toDelete) {
                  try {
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    });
                    totalDeleted++;
                    console.log(`Deleted: ${cache.key} (created ${cache.created_at})`);
                  } catch (e) {
                    console.log(`Skipped ${cache.key}: ${e.message}`);
                  }
                }
                if (caches.length < 100) break;
                page++;
              }
              console.log(`Cleaned ${totalDeleted} caches for prefix '${prefix}'`);
            }

      - name: install deps (linux)
        if: matrix.name == 'linux-x64'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            libglfw3-dev libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev \
            libssl-dev libcurl4-openssl-dev libbz2-dev liblzma-dev \
            libevent-dev protobuf-compiler nasm golang-go

      - name: install deps (windows cross)
        if: matrix.name == 'windows-x64'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq || true
          # Full MinGW-w64 toolchain for 64-bit Windows cross-compilation:
          # - mingw-w64-x86-64-dev: headers + import libs (winsock2.h, libws2_32.a, etc.)
          # - gcc-mingw-w64-x86-64: C compiler (x86_64-w64-mingw32-gcc)
          # - g++-mingw-w64-x86-64: C++ compiler (x86_64-w64-mingw32-g++)
          # - binutils-mingw-w64-x86-64: cross-binutils (ar, ld, ranlib, dlltool, windres)
          # - mingw-w64-common: common files shared across architectures
          # - nasm: assembler for .s files in hev-task-system
          sudo apt-get install -y -qq --no-install-recommends \
            mingw-w64-x86-64-dev \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            mingw-w64-common \
            nasm
          # Verify the installation is complete
          echo "=== MinGW gcc ==="
          x86_64-w64-mingw32-gcc --version | head -1 || { echo "FATAL: compiler missing!"; exit 1; }
          echo "=== MinGW g++ ==="
          x86_64-w64-mingw32-g++ --version | head -1 || echo "WARNING: g++ missing"
          echo "=== MinGW sysroot ==="
          SYSROOT=$(x86_64-w64-mingw32-gcc -print-sysroot 2>/dev/null || echo "")
          echo "sysroot: ${SYSROOT:-none}"
          echo "=== winsock2.h ==="
          find /usr -name "winsock2.h" -path "*mingw*" 2>/dev/null | head -3 || echo "MISSING!"
          echo "=== libws2_32.a ==="
          find /usr -name "libws2_32.a" -path "*mingw*" 2>/dev/null | head -3 || echo "MISSING!"
          echo "=== libiphlpapi.a ==="
          find /usr -name "libiphlpapi.a" -path "*mingw*" 2>/dev/null | head -3 || echo "MISSING!"
          echo "=== crt2.o ==="
          find /usr -name "crt2.o" -path "*mingw*" 2>/dev/null | head -3 || echo "MISSING!"
          # Quick compile+link test
          echo "=== Compile+link test ==="
          printf '#include <winsock2.h>\n#include <windows.h>\n#include <ws2tcpip.h>\n#include <iphlpapi.h>\nint WINAPI WinMain(HINSTANCE h, HINSTANCE p, LPSTR c, int n) { WSADATA wsa; WSAStartup(MAKEWORD(2,2), &wsa); WSACleanup(); return 0; }\n' > /tmp/_mingw_test.c
          if x86_64-w64-mingw32-gcc /tmp/_mingw_test.c -o /tmp/_mingw_test.exe -lws2_32 -liphlpapi -static 2>&1; then
            echo "Compile+link: SUCCESS"
            rm -f /tmp/_mingw_test.exe
          else
            echo "Compile+link: FAILED — cmake build will also fail"
          fi
          rm -f /tmp/_mingw_test.c

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu, aarch64-linux-android
          components: rust-src

      - name: cache cmake
        if: matrix.name != 'android-arm64-v8a'
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'core/**', 'src_cpp/**', 'include/**') }}
          restore-keys: cmake-${{ matrix.name }}-

      - name: cache gradle
        if: matrix.name == 'android-arm64-v8a'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: setup ndk
        id: setup-ndk
        if: matrix.name == 'android-arm64-v8a'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: fetch imgui
        run: |
          mkdir -p third_party
          if [ ! -d "third_party/imgui" ]; then
            git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git third_party/imgui
          fi

      - name: copy pre-generated icons
        run: |
          cp src_cpp/icon_192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
          cp src_cpp/icon_48.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true

      - name: build rust (engine + ffi, in-process)
        run: |
          set -euo pipefail

          # Clean stale build script cache so build.rs always recompiles
          rm -rf target/release/build/aether-engine-* target/debug/build/aether-engine-* 2>/dev/null || true

          if [ "${{ matrix.name }}" = "android-arm64-v8a" ]; then
            NDK="${ANDROID_NDK_HOME:-${{ steps.setup-ndk.outputs.ndk-path }}}"
            if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
              echo "ANDROID_NDK_HOME not set or missing: $NDK"
              exit 1
            fi
            HOST_TAG=linux-x86_64
            PREBUILT="$NDK/toolchains/llvm/prebuilt/$HOST_TAG"
            BIN="$PREBUILT/bin"
            export PATH="$BIN:$PATH"
            export ANDROID_NDK_HOME="$NDK"
            export ANDROID_NDK_ROOT="$NDK"

            export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
            export CXX_aarch64_linux_android="$BIN/aarch64-linux-android24-clang++"
            export AR_aarch64_linux_android="$BIN/llvm-ar"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$BIN/llvm-ar"
            ln -sf "$BIN/aarch64-linux-android24-clang" "$BIN/aarch64-linux-android-clang"
            ln -sf "$BIN/aarch64-linux-android24-clang++" "$BIN/aarch64-linux-android-clang++"
            export CC=aarch64-linux-android24-clang
            export CXX=aarch64-linux-android24-clang++
            export AR=llvm-ar

            export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$PREBUILT/sysroot"
            export CFLAGS_aarch64_linux_android="--sysroot=$PREBUILT/sysroot"
            export CXXFLAGS_aarch64_linux_android="--sysroot=$PREBUILT/sysroot"

            echo "Using NDK: $NDK"
            "$CC_aarch64_linux_android" --version | head -1
          fi

          cargo build --manifest-path core/Cargo.toml --release --target ${{ matrix.target }} -p aether-ffi

          DEST="$(pwd)/target/${{ matrix.target }}/release/libaether_ffi.a"
          mkdir -p "$(dirname "$DEST")"
          if [ ! -f "$DEST" ]; then
            for f in \
              "$(pwd)/core/target/${{ matrix.target }}/release/libaether_ffi.a" \
              "$(pwd)/core/aether-ffi/target/${{ matrix.target }}/release/libaether_ffi.a"; do
              if [ -f "$f" ] && [ "$(realpath "$f" 2>/dev/null || echo "$f")" != "$(realpath "$DEST" 2>/dev/null || echo "$DEST")" ]; then
                cp -f "$f" "$DEST"
                break
              fi
            done
          fi
          ls -lh "$DEST"
          test -f "$DEST"
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTFLAGS: ${{ matrix.name == 'windows-x64' && '-C target-feature=+crt-static -C link-args=-static-libgcc -C link-args=-static-libstdc++ -C link-args=-Wl,-Bstatic -C link-args=-lpthread -C link-args=-lwinpthread -C link-args=-Wl,-Bdynamic' || '' }}

      - name: build frontend (linux)
        if: matrix.name == 'linux-x64'
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_CXX_COMPILER=g++ \
            ${{ matrix.cmake_args }} -DRUST_TARGET=${{ matrix.target }}
          cmake --build . --config Release

      - name: build frontend (windows)
        if: matrix.name == 'windows-x64'
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            ${{ matrix.cmake_args }} -DRUST_TARGET=${{ matrix.target }}
          cmake --build . --config Release

      - name: build apk
        if: matrix.name == 'android-arm64-v8a'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
            unzip -q tools.zip
            mv cmdline-tools latest
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

          cd android
          gradle wrapper --gradle-version 9.0
          ./gradlew assembleRelease -PNDK_ABI=arm64-v8a

      - name: sign apk
        if: matrix.name == 'android-arm64-v8a'
        run: |
          set -euo pipefail
          # Generate a fresh keystore for CI signing
          keytool -genkeypair -v \
            -keystore /tmp/release.keystore \
            -alias fcae \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=FCAE VPN, OU=Dev, O=FCAE, L=Unknown, ST=Unknown, C=US"

          # Find build-tools
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/*/ | sort -V | tail -1)
          "${BT}apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias fcae \
            android/app/build/outputs/apk/release/*.apk

          # Verify signature
          "${BT}apksigner" verify --verbose \
            android/app/build/outputs/apk/release/*.apk || true
          echo "APK signed successfully"

      - name: package
        if: matrix.name != 'android-arm64-v8a'
        run: |
          set -euo pipefail
          mkdir -p package
          cp build/fcaevpn* package/ 2>/dev/null || true
          chmod +x package/* 2>/dev/null || true
          cd package
          for f in fcaevpn*; do
            [ -f "$f" ] || continue
            if [[ "$f" == *.exe ]]; then
              mv "$f" "FCAE_VPN-${{ matrix.name }}.exe"
            else
              mv "$f" "FCAE_VPN-${{ matrix.name }}"
            fi
          done
          ls -la
          test $(ls -1 | wc -l) -ge 1

      - name: package (android)
        if: matrix.name == 'android-arm64-v8a'
        run: |
          set -euo pipefail
          mkdir -p package
          cp android/app/build/outputs/apk/release/*.apk package/FCAE_VPN-android-arm64-v8a.apk 2>/dev/null || true
          test -f package/FCAE_VPN-android-arm64-v8a.apk
          ls -lah package/

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: FCAE_VPN-${{ matrix.name }}
          path: package/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success' && github.event_name == 'workflow_dispatch'
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: zip for GitHub Release
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          mkdir -p release-zips
          for dir in artifacts/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            # For prereleases, include '-prerelease' in the zip name
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              zip_name="${name}-prerelease.zip"
            else
              zip_name="${name}.zip"
            fi
            (
              cd "$dir"
              zip -9 -j "../../release-zips/${zip_name}" ./*
            )
            echo "Created release-zips/${zip_name}"
            unzip -l "release-zips/${zip_name}" | head -20
          done
          ls -lah release-zips/
          test $(ls -1 release-zips/*.zip | wc -l) -ge 1

      - name: delete existing release + tag
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const tag = '${{ github.event.inputs.release_tag }}';
            // Delete release if it exists
            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner, repo: context.repo.repo, release_id: rel.data.id
              });
              console.log(`Deleted release ${rel.data.id} for tag ${tag}`);
            } catch (e) { console.log(`No existing release: ${e.message}`); }
            // Delete tag ref if it exists
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`
              });
              console.log(`Deleted tag ref ${tag}`);
            } catch (e) { console.log(`No existing tag: ${e.message}`); }

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "FCAE VPN ${{ github.event.inputs.release_tag }}"
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-zips/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
