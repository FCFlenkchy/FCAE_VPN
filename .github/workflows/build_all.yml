name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'pre-release'
        required: false
        default: 'true'
        type: boolean
      extra_notes:
        description: 'release notes (used as the release body and the update-dialog notes)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x64
            os: ubuntu-latest
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DAETHER_TARGET=LINUX_X64

          - target: x86_64-pc-windows-gnu
            name: windows-x64
            os: ubuntu-latest
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_SYSTEM_NAME=Windows
              -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
              -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
              -DAETHER_TARGET=WIN_X64

          - target: aarch64-linux-android
            name: android-arm64-v8a
            os: ubuntu-latest
            abi: arm64-v8a
            cmake_args: "-DAETHER_TARGET=ANDROID_ARM64"

          - target: armv7-linux-androideabi
            name: android-armeabi-v7a
            os: ubuntu-latest
            abi: armeabi-v7a
            cmake_args: "-DAETHER_TARGET=ANDROID_ARM32"

          - target: x86_64-linux-android
            name: android-x86_64
            os: ubuntu-latest
            abi: x86_64
            cmake_args: "-DAETHER_TARGET=ANDROID_X86_64"

          - target: x86_64-linux-android
            name: android-universal
            os: ubuntu-latest
            abi: ""
            build_type: android_universal
            cmake_args: "-DAETHER_TARGET=ANDROID_UNIVERSAL"

          - target: aarch64-apple-darwin
            name: macos-arm64
            os: macos-latest
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DAETHER_TARGET=MACOS_ARM64

          - target: x86_64-apple-darwin
            name: macos-x64
            os: macos-latest
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_OSX_ARCHITECTURES=x86_64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
              -DAETHER_TARGET=MACOS_X64

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup Java 17 for Android Gradle Plugin
        if: startsWith(matrix.name, 'android-')
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: ensure submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      # The in-process tun2socks bridge links Go code into libfcae_ffi.a, so
      # every runner needs a Go toolchain -- including the Android and
      # Windows-cross jobs, which previously needed none because tun2socks
      # shipped as a prebuilt binary.
      #
      # The version is driven by the tun2socks submodule's go.mod, which
      # declares `go 1.26.3`. Go refuses to build a module that requires a
      # newer toolchain than the one running, so anything older fails with
      # "module ... requires go >= 1.26.3". Keep this >= that value; `stable`
      # tracks the current release so submodule bumps do not break the build.
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      # setup-go puts its Go first on PATH, but the distro `golang-go` package
      # previously installed below was far older and some toolchains resolve
      # /usr/bin/go directly. Pin GO_BIN (honoured by the bridge build
      # scripts) to the toolchain setup-go provisioned.
      - name: pin go toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          go version

      - name: cleanup old caches
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            const oneDayAgo = Date.now() - 24 * 60 * 60 * 1000;
            const prefixes = ['cmake-', 'gradle-', 'sccache-', 'glfw-'];
            // Rust caches are managed by Swatinem/rust-cache â€” skip those.

            for (const prefix of prefixes) {
              let page = 1;
              let totalDeleted = 0;
              while (true) {
                const res = await github.rest.actions.getActionsCacheList({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  key: prefix,
                  per_page: 100,
                  page,
                });
                const caches = res.data.actions_caches || [];
                if (caches.length === 0) break;

                const old = caches.filter(c => new Date(c.created_at).getTime() < oneDayAgo);
                // Also cap at 3 most recent per prefix
                const recent = caches.filter(c => new Date(c.created_at).getTime() >= oneDayAgo);
                const excess = recent.slice(3);
                const toDelete = [...old, ...excess];

                for (const cache of toDelete) {
                  try {
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    });
                    totalDeleted++;
                    console.log(`Deleted: ${cache.key} (created ${cache.created_at})`);
                  } catch (e) {
                    console.log(`Skipped ${cache.key}: ${e.message}`);
                  }
                }
                if (caches.length < 100) break;
                page++;
              }
              console.log(`Cleaned ${totalDeleted} caches for prefix '${prefix}'`);
            }

      - name: update version.json for build
        run: |
          set -euo pipefail
          export TAG="${{ github.event.inputs.release_tag }}${{ inputs.prerelease && '-prerelease' || '' }}"
          export DATE=$(date +%Y-%m-%d)
          export NOTES="${{ github.event.inputs.extra_notes }}"
          export DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases"

          python3 << 'PYEOF'
          import json, os
          tag = os.environ['TAG']
          date = os.environ['DATE']
          notes = os.environ.get('NOTES', '')
          download_url = os.environ['DOWNLOAD_URL']
          data = {
              'version': tag,
              'release_date': date,
              'release_notes': notes,
              'download_url': download_url
          }
          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          print('Updated version.json for build:')
          print(open('version.json').read())
          PYEOF

      - name: install deps (linux)
        if: matrix.name == 'linux-x64'
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          # Freshly-booted ubuntu-latest VMs run apt-daily/unattended-upgrades at
          # boot; they hold the apt/dpkg locks while apt 2.7 waits on them
          # FOREVER (this is what made the workflow look "stuck" here).
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
            echo "waiting for boot-time apt processes to release locks..."
            sleep 5
          done
          # NOTE: sudo strips env vars, so DEBIAN_FRONTEND must be assigned
          # after sudo (as below); an env: block on the step does NOT reach apt.
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxxf86vm-dev \
            libssl-dev libcurl4-openssl-dev libbz2-dev liblzma-dev \
            libevent-dev protobuf-compiler nasm cmake ninja-build
          # GitHub's codeload endpoint occasionally answers 5xx/connection
          # resets on fresh runners; retry instead of failing the job.
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            https://github.com/glfw/glfw/archive/refs/tags/3.4.tar.gz -o glfw.tar.gz
          tar xzf glfw.tar.gz
          cd glfw-3.4
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local/glfw_static \
            -DBUILD_SHARED_LIBS=OFF \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DGLFW_BUILD_DOCS=OFF -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF
          cmake --build build
          sudo cmake --install build
          cd ..

      - name: install deps (windows cross)
        if: matrix.name == 'windows-x64'
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          # Freshly-booted ubuntu-latest VMs run apt-daily/unattended-upgrades at
          # boot; they hold the apt/dpkg locks while apt 2.7 waits on them
          # FOREVER (this is what made the workflow look "stuck" here).
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
            echo "waiting for boot-time apt processes to release locks..."
            sleep 5
          done
          # NOTE: sudo strips env vars, so DEBIAN_FRONTEND must be assigned
          # after sudo (as below); an env: block on the step does NOT reach apt.
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          # Go itself comes from the setup-go step (the distro package is too
          # old for the tun2socks submodule); cgo drives the mingw toolchain
          # installed here for the Windows cross build.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nasm \
            cmake
          echo "=== MinGW toolchain check ==="
          which x86_64-w64-mingw32-gcc x86_64-w64-mingw32-g++
          x86_64-w64-mingw32-gcc --version | head -1
          x86_64-w64-mingw32-g++ --version | head -1

      - name: cache macos glfw build
        if: matrix.name == 'macos-x64'
        id: cache-glfw
        uses: actions/cache@v6
        with:
          path: /usr/local/glfw_x64
          key: glfw-x64-3.4

      - name: install deps (macOS)
        if: startsWith(matrix.name, 'macos-')
        run: |
          # `go` intentionally omitted: the setup-go step above provisions a
          # toolchain new enough for the tun2socks submodule, and brew's would
          # only compete with it on PATH.
          #
          # Bottle downloads go through ghcr.io and intermittently hit 5xx on
          # brand-new runner images; give brew a few attempts rather than
          # failing the whole job on one bad fetch.
          brew_ok=0
          for attempt in 1 2 3; do
            brew install cmake ninja nasm protobuf && { brew_ok=1; break; }
            echo "::warning::brew install failed (attempt $attempt/3); retrying in 15s"
            sleep 15
          done
          if [ "$brew_ok" != 1 ]; then
            echo "::error::brew install failed after 3 attempts"
            exit 1
          fi
          if [ "${{ matrix.name }}" = "macos-x64" ]; then
            ARCH_ARGS="-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0"
            GLFW_PREFIX=/usr/local/glfw_x64
          else
            ARCH_ARGS="-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0"
            GLFW_PREFIX=/usr/local/glfw_arm64
          fi
          # Same transient-5xx hardening as the Linux step: codeload 504s on
          # fresh runners used to kill this step (curl exit 56).
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            https://github.com/glfw/glfw/archive/refs/tags/3.4.tar.gz -o glfw.tar.gz
          tar xzf glfw.tar.gz
          cd glfw-3.4
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${ARCH_ARGS} \
            -DCMAKE_INSTALL_PREFIX=${GLFW_PREFIX} \
            -DBUILD_SHARED_LIBS=OFF \
            -DGLFW_BUILD_DOCS=OFF -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF
          cmake --build build
          sudo cmake --install build
          cd ..

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu, aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, aarch64-apple-darwin, x86_64-apple-darwin
          components: rust-src

      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          workspaces: |
            core -> target
          cache-on-failure: true

      - name: cache cmake
        if: "!startsWith(matrix.name, 'android-')"
        uses: actions/cache@v6
        with:
          path: build
          key: cmake-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'core/**', 'src_cpp/**', 'include/**') }}
          restore-keys: cmake-${{ matrix.name }}-

      - name: cache gradle
        if: startsWith(matrix.name, 'android-')
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: setup ndk
        id: setup-ndk
        if: startsWith(matrix.name, 'android-')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: Build Psiphon Android AAR from pinned source
        if: startsWith(matrix.name, 'android-')
        shell: bash
        run: |
          set -euo pipefail
          # Use this submodule's vendored gomobile and Docker-pinned Go/NDK.
          # Do not mix module-aware fork tooling with this upstream checkout:
          # this revision's make.bash explicitly uses GOPATH mode.
          ROOT="$PWD"
          # Build the gitlink pinned by FCAE, not the tip of the upstream branch.
          PSIPHON_REV=$(git rev-parse HEAD:core/psiphon)
          test "$(git -C core/psiphon rev-parse HEAD)" = "$PSIPHON_REV"
          PSIPHON_GIT_DIR=$(git -C core/psiphon rev-parse --absolute-git-dir)
          echo "Building core/psiphon at $PSIPHON_REV"
          docker build --platform=linux/amd64 -t fcae-psiphon-android \
            -f core/psiphon/MobileLibrary/Android/Dockerfile core/psiphon/MobileLibrary
          docker run --platform=linux/amd64 --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GOCACHE=/tmp/go-cache \
            -e GIT_DIR=/psiphon-git \
            -e GIT_WORK_TREE=/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core \
            -e PSIPHON_REV="$PSIPHON_REV" \
            -v "$PSIPHON_GIT_DIR:/psiphon-git:ro" \
            -v "$ROOT/core/psiphon:/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core" \
            fcae-psiphon-android /bin/bash -c '
              set -euo pipefail
              # The submodule .git file points outside its source mount.
              # GIT_DIR/GIT_WORK_TREE use the explicit metadata mount instead.
              cd "$GIT_WORK_TREE/MobileLibrary/Android"
              test "$(git rev-parse HEAD)" = "$PSIPHON_REV"
              git rev-parse --short=10 HEAD
              ./make.bash
            '
          mkdir -p android/psiphon/libs
          cp core/psiphon/MobileLibrary/Android/ca.psiphon.aar android/psiphon/libs/
          INSPECT=$(mktemp -d)
          trap 'rm -rf "$INSPECT"' EXIT
          unzip -q android/psiphon/libs/ca.psiphon.aar 'jni/*' -d "$INSPECT"
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            LIB="$INSPECT/jni/$ABI/libgojni.so"
            test -s "$LIB"
            readelf -lW "$LIB" | awk '$1 == "LOAD" { found=1; if ($NF != "0x4000") bad=1 } END { exit (!found || bad) }'
          done

      # ca.psiphon.aar is an intermediate consumed by :app below, not an
      # artifact or a standalone release asset.

      - name: fetch imgui
        run: |
          mkdir -p third_party
          if [ ! -d "third_party/imgui" ]; then
            git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git third_party/imgui
          fi
      # zeptun's minimum_zig_version; the stable 0.16.x line.
      - name: setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The zeptun TUN engine (Zig, static C ABI) must exist BEFORE cargo
      # links the bridge below: its build script consumes
      # core/zeptun/zig-out/lib (desktop) or zig-out/android/prebuilt (the
      # `zig build android` matrix step). Windows cross-compiles the GNU
      # archive; the engine stays runtime-gated there (Windows rollout
      # pending upstream adapter-GUID support).
      - name: build zeptun engine (libzeptun)
        shell: bash
        run: |
          set -euo pipefail
          cd core/zeptun
          case "${{ matrix.name }}" in
            linux-x64)   zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSmall ;;
            windows-x64)
              zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSmall
              # Zig 0.16 emits zeptun.lib; Cargo's GNU target expects libzeptun.a.
              mv zig-out/lib/zeptun.lib zig-out/lib/libzeptun.a
              ;;
            macos-arm64) zig build -Dtarget=aarch64-macos -Doptimize=ReleaseSmall ;;
            macos-x64)   zig build -Dtarget=x86_64-macos -Doptimize=ReleaseSmall ;;
            android-*)   zig build android -Doptimize=ReleaseSmall ;;
            *) echo "::error::Unsupported zeptun target: ${{ matrix.name }}"; exit 1 ;;
          esac
          case "${{ matrix.name }}" in
            android-*)
              for abi in arm64-v8a armeabi-v7a x86_64 x86; do
                test -s "zig-out/android/prebuilt/$abi/libzeptun.a"
              done
              ;;
            *) test -s zig-out/lib/libzeptun.a ;;
          esac
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build rust (engine + ffi, in-process)
        run: |
          set -euo pipefail

          rm -rf target/release/build/aether-engine-* target/debug/build/aether-engine-* 2>/dev/null || true

          if [ "${{ matrix.name }}" = "macos-x64" ]; then
            export MACOSX_DEPLOYMENT_TARGET=13.0
          fi

          if [[ "${{ matrix.name }}" == android-* ]]; then
            NDK="${ANDROID_NDK_HOME:-${{ steps.setup-ndk.outputs.ndk-path }}}"
            if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
              echo "ANDROID_NDK_HOME not set or missing: $NDK"
              exit 1
            fi
            HOST_TAG=linux-x86_64
            PREBUILT="$NDK/toolchains/llvm/prebuilt/$HOST_TAG"
            BIN="$PREBUILT/bin"
            export PATH="$BIN:$PATH"
            export ANDROID_NDK_HOME="$NDK"
            export ANDROID_NDK_ROOT="$NDK"

            if [ "${{ matrix.name }}" = "android-universal" ]; then
              echo "Building Rust for all Android ABIs (universal)..."
              
              for TARGET_TRIPLE in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
                echo "  -> Building for $TARGET_TRIPLE"
                
                if [ "$TARGET_TRIPLE" = "aarch64-linux-android" ]; then
                  NDK_CLANG_PREFIX=aarch64-linux-android
                  RUST_ENV_LOWER=aarch64_linux_android
                  RUST_ENV_UPPER=AARCH64_LINUX_ANDROID
                elif [ "$TARGET_TRIPLE" = "x86_64-linux-android" ]; then
                  NDK_CLANG_PREFIX=x86_64-linux-android
                  RUST_ENV_LOWER=x86_64_linux_android
                  RUST_ENV_UPPER=X86_64_LINUX_ANDROID
                else
                  NDK_CLANG_PREFIX=armv7a-linux-androideabi
                  RUST_ENV_LOWER=armv7_linux_androideabi
                  RUST_ENV_UPPER=ARMV7_LINUX_ANDROIDEABI
                fi
                
                CLANG="$BIN/${NDK_CLANG_PREFIX}24-clang"
                CLANGXX="$BIN/${NDK_CLANG_PREFIX}24-clang++"
                
                export "CC_${RUST_ENV_LOWER}"="$CLANG"
                export "CXX_${RUST_ENV_LOWER}"="$CLANGXX"
                export "AR_${RUST_ENV_LOWER}"="$BIN/llvm-ar"
                export "CARGO_TARGET_${RUST_ENV_UPPER}_LINKER"="$CLANG"
                export "CARGO_TARGET_${RUST_ENV_UPPER}_AR"="$BIN/llvm-ar"
                ln -sf "$CLANG" "$BIN/${NDK_CLANG_PREFIX}-clang"
                ln -sf "$CLANGXX" "$BIN/${NDK_CLANG_PREFIX}-clang++"
                export CC="${NDK_CLANG_PREFIX}24-clang"
                export CXX="${NDK_CLANG_PREFIX}24-clang++"
                export AR=llvm-ar
                
                export "BINDGEN_EXTRA_CLANG_ARGS_${RUST_ENV_LOWER}"="--sysroot=$PREBUILT/sysroot"
                export "CFLAGS_${RUST_ENV_LOWER}"="--sysroot=$PREBUILT/sysroot"
                export "CXXFLAGS_${RUST_ENV_LOWER}"="--sysroot=$PREBUILT/sysroot"
                
                # psiphon = attach to the official AAR (no Go psi in this .so).
                # psiphon-live would compile a second Go runtime — do not.
                cargo build --manifest-path core/fcae-ffi/Cargo.toml --release --target "$TARGET_TRIPLE" -p fcae-ffi --features aether,tor,psiphon,zeptun

                # CARGO_TARGET_DIR (set in env: below) puts every artifact in
                # one place, so there is no longer a fallback copy to do.
                DEST="$(pwd)/target/$TARGET_TRIPLE/release/libfcae_ffi.a"
                ls -lh "$DEST"
                test -f "$DEST"
              done
              echo "All Android Rust targets built successfully"
            else
              if [ "${{ matrix.name }}" = "android-arm64-v8a" ]; then
                NDK_CLANG_PREFIX=aarch64-linux-android
                RUST_ENV_LOWER=aarch64_linux_android
                RUST_ENV_UPPER=AARCH64_LINUX_ANDROID
              elif [ "${{ matrix.name }}" = "android-x86_64" ]; then
                NDK_CLANG_PREFIX=x86_64-linux-android
                RUST_ENV_LOWER=x86_64_linux_android
                RUST_ENV_UPPER=X86_64_LINUX_ANDROID
              else
                NDK_CLANG_PREFIX=armv7a-linux-androideabi
                RUST_ENV_LOWER=armv7_linux_androideabi
                RUST_ENV_UPPER=ARMV7_LINUX_ANDROIDEABI
              fi

              CLANG="$BIN/${NDK_CLANG_PREFIX}24-clang"
              CLANGXX="$BIN/${NDK_CLANG_PREFIX}24-clang++"

              export "CC_${RUST_ENV_LOWER}"="$CLANG"
              export "CXX_${RUST_ENV_LOWER}"="$CLANGXX"
              export "AR_${RUST_ENV_LOWER}"="$BIN/llvm-ar"
              export "CARGO_TARGET_${RUST_ENV_UPPER}_LINKER"="$CLANG"
              export "CARGO_TARGET_${RUST_ENV_UPPER}_AR"="$BIN/llvm-ar"
              ln -sf "$CLANG" "$BIN/${NDK_CLANG_PREFIX}-clang"
              ln -sf "$CLANGXX" "$BIN/${NDK_CLANG_PREFIX}-clang++"
              export CC="${NDK_CLANG_PREFIX}24-clang"
              export CXX="${NDK_CLANG_PREFIX}24-clang++"
              export AR=llvm-ar

              export "BINDGEN_EXTRA_CLANG_ARGS_${RUST_ENV_LOWER}"="--sysroot=$PREBUILT/sysroot"
              export "CFLAGS_${RUST_ENV_LOWER}"="--sysroot=$PREBUILT/sysroot"
              export "CXXFLAGS_${RUST_ENV_LOWER}"="--sysroot=$PREBUILT/sysroot"

              echo "Using NDK: $NDK"
              "$CLANG" --version | head -1
              
              # psiphon = attach to the official AAR. Do not enable psiphon-live.
              cargo build --manifest-path core/fcae-ffi/Cargo.toml --release --target ${{ matrix.target }} -p fcae-ffi --features aether,tor,psiphon,zeptun

              DEST="$(pwd)/target/${{ matrix.target }}/release/libfcae_ffi.a"
              ls -lh "$DEST"
              test -f "$DEST"
            fi
          else
            # Non-Android: compile desktop Psiphon as libfcae_psiphon (force_shared).
            # Android keeps AAR-only (no psiphon-live).
            cargo build --manifest-path core/fcae-ffi/Cargo.toml --release --target ${{ matrix.target }} -p fcae-ffi --features aether,tor,psiphon-live,zeptun

            DEST="$(pwd)/target/${{ matrix.target }}/release/libfcae_ffi.a"
            ls -lh "$DEST"
            test -f "$DEST"

            # Standalone Psiphon console: the tunnel-core library driven by a
            # plain desktop binary (same psi code path as libfcae_psiphon,
            # no GUI). Pure Go, so it cross-compiles with CGO_ENABLED=0.
            ROOT="$(pwd)"
            mkdir -p build
            BINEXT=""
            case "${{ matrix.target }}" in
              x86_64-pc-windows-gnu)     GOOS=windows GOARCH=amd64 BINEXT=".exe" ;;
              aarch64-apple-darwin)      GOOS=darwin  GOARCH=arm64 ;;
              x86_64-apple-darwin)       GOOS=darwin  GOARCH=amd64 ;;
              aarch64-unknown-linux-gnu) GOOS=linux   GOARCH=arm64 ;;
              *)                         GOOS=linux   GOARCH=amd64 ;;
            esac
            ( cd core/fcae-ffi/bridges/psiphon/go \
              && CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
                 go build -trimpath -ldflags "-s -w" \
                 -o "$ROOT/build/fcae-psiphon-console$BINEXT" ./cmd/fcae-psiphon-console )
            ls -lh "$ROOT/build/fcae-psiphon-console$BINEXT"
          fi
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTFLAGS: ${{ matrix.name == 'windows-x64' && '-C target-feature=+crt-static -C link-args=-static-libgcc -C link-args=-static-libstdc++ -C link-args=-Wl,-Bstatic -C link-args=-lpthread -C link-args=-lwinpthread -C link-args=-Wl,-Bdynamic' || '' }}

      - name: build frontend (linux)
        if: matrix.name == 'linux-x64'
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_PREFIX_PATH=/usr/local/glfw_static \
            ${{ matrix.cmake_args }} -DRUST_TARGET=${{ matrix.target }} \
            -DFCAE_VERSION_OVERRIDE="${{ github.event.inputs.release_tag }}${{ inputs.prerelease && '-prerelease' || '' }}"
          cmake --build . --config Release

      - name: build frontend (windows)
        if: matrix.name == 'windows-x64'
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            ${{ matrix.cmake_args }} -DRUST_TARGET=${{ matrix.target }} \
            -DFCAE_VERSION_OVERRIDE="${{ github.event.inputs.release_tag }}${{ inputs.prerelease && '-prerelease' || '' }}"
          cmake --build . --config Release

      - name: build frontend (macOS)
        if: startsWith(matrix.name, 'macos-')
        run: |
          mkdir -p build && cd build
          if [ "${{ matrix.name }}" = "macos-x64" ]; then
            export CMAKE_PREFIX_PATH=/usr/local/glfw_x64
          else
            export CMAKE_PREFIX_PATH=/usr/local/glfw_arm64
          fi
          cmake .. -G Ninja \
            ${{ matrix.cmake_args }} -DRUST_TARGET=${{ matrix.target }} \
            -DFCAE_VERSION_OVERRIDE="${{ github.event.inputs.release_tag }}${{ inputs.prerelease && '-prerelease' || '' }}"
          cmake --build . --config Release

      - name: build apk
        if: startsWith(matrix.name, 'android-')
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            wget -q --tries=3 --timeout=60 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
            unzip -q tools.zip
            mv cmdline-tools latest
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

          cd android
          gradle wrapper --gradle-version 9.6.0
          if [ "${{ matrix.name }}" = "android-universal" ]; then
            ./gradlew assembleRelease -PUNIVERSAL=true -PBUILD_TYPE=android_universal
          else
            ./gradlew assembleRelease -PNDK_ABI=${{ matrix.abi }}
          fi

      - name: sign apk
        if: startsWith(matrix.name, 'android-')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/*/ | sort -V | tail -1)
          "${BT}apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            android/app/build/outputs/apk/release/*.apk

          "${BT}apksigner" verify --verbose \
            android/app/build/outputs/apk/release/*.apk || true
          echo "APK signed successfully"
          rm -f /tmp/release.keystore

      - name: import macos codesigning cert
        if: startsWith(matrix.name, 'macos-')
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$MACOS_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/macoscert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/macoscert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$RUNNER_TEMP/macoscert.p12"

      - name: package
        if: "!startsWith(matrix.name, 'android-') && !startsWith(matrix.name, 'macos-')"
        run: |
          set -euo pipefail
          mkdir -p package
          cp build/fcaevpn* package/ 2>/dev/null || true
          # Desktop Psiphon is libfcae_psiphon (c-shared). tun2socks is inside
          # libfcae_ffi.a on desktop — do not look for libfcae_go_bridge here.
          cp build/libfcae_psiphon.* package/ 2>/dev/null || true
          cp build/fcae_psiphon.dll package/ 2>/dev/null || true
          # Standalone Psiphon console binary (same psi code path, no GUI).
          cp build/fcae-psiphon-console* package/ 2>/dev/null || true
          chmod +x package/* 2>/dev/null || true

          if [ "${{ matrix.name }}" = "linux-x64" ]; then
            mkdir -p package/lib
            BIN=build/fcaevpn
            if [ -f "$BIN" ]; then
              echo "Checking dynamic dependencies:"
              ldd "$BIN" 2>/dev/null | grep -v -E 'linux-vdso|ld-linux|libc\.|libm\.|libdl\.|librt\.|libpthread\.|libstdc\+\+\.|libgcc_s\.|libX11\.|libXi\.|libGL\.|libGLX\.|libGLdispatch\.|libxcb\.|libXau\.|libXdmcp\.|libbsd\.|libmd\.' || true
              printf '%s\n' \
                '#!/bin/sh' \
                'DIR="$(cd "$(dirname "$0")" && pwd)"' \
                '# $DIR covers libfcae_go_bridge.so, which sits next to the binary.' \
                'export LD_LIBRARY_PATH="$DIR/lib:$DIR:$LD_LIBRARY_PATH"' \
                'exec "$DIR/FCAE_VPN-linux-x64" "$@"' > package/fcaevpn.sh
              chmod +x package/fcaevpn.sh
            fi
          fi

          cd package
          for f in fcaevpn*; do
            [ -f "$f" ] || continue
            if [[ "$f" == *.exe ]]; then
              mv "$f" "FCAE_VPN-${{ matrix.name }}.exe"
            elif [[ "$f" == *.sh ]]; then
              mv "$f" "FCAE_VPN-${{ matrix.name }}.sh"
            elif [[ "$f" != *.so* ]] && [[ "$f" != fcaevpn ]]; then
              : # skip libs, already in lib/
            fi
          done
          if [ -f fcaevpn ]; then
            mv fcaevpn "FCAE_VPN-${{ matrix.name }}"
          fi
          ls -la
          test $(ls -1 | wc -l) -ge 1

      - name: install osslsigncode (windows signing)
        if: matrix.name == 'windows-x64'
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
            echo "waiting for boot-time apt processes to release locks..."
            sleep 5
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends osslsigncode

      - name: sign windows exe
        if: matrix.name == 'windows-x64'
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WIN_CERT_BASE64:-}" ]; then
            echo "WIN_CERT_BASE64 secret not set, skipping windows signing"
            exit 0
          fi
          echo "$WIN_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/wincert.pfx"

          for f in package/*.exe; do
            [ -f "$f" ] || continue
            osslsigncode sign \
              -pkcs12 "$RUNNER_TEMP/wincert.pfx" \
              -pass "$WIN_CERT_PASSWORD" \
              -n "FCAE VPN" \
              -i "https://github.com/${{ github.repository }}" \
              -t http://timestamp.digicert.com \
              -in "$f" \
              -out "${f}.signed"
            mv -f "${f}.signed" "$f"
            osslsigncode verify -in "$f" || true
          done

          rm -f "$RUNNER_TEMP/wincert.pfx"
          echo "Windows exe signed successfully"

      - name: sign linux binaries (gpg)
        if: matrix.name == 'linux-x64'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "GPG_PRIVATE_KEY secret not set, skipping linux signing"
            exit 0
          fi

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "Signing with key: $KEY_ID"

          for f in package/*; do
            [ -f "$f" ] || continue
            gpg --batch --yes --local-user "$KEY_ID" --detach-sign --armor "$f"
          done

          # publish the public key alongside the binaries so users can verify
          gpg --batch --armor --export "$KEY_ID" > package/FCAE_VPN-public-key.asc

          rm -rf "$GNUPGHOME"
          ls -la package/
          echo "Linux binaries signed successfully"

      - name: package (android)
        if: startsWith(matrix.name, 'android-')
        run: |
          set -euo pipefail
          mkdir -p package
          cp android/app/build/outputs/apk/release/*.apk "package/FCAE_VPN-${{ matrix.name }}.apk" 2>/dev/null || true
          test -f "package/FCAE_VPN-${{ matrix.name }}.apk"
          ls -lah package/

      - name: package (macOS)
        if: startsWith(matrix.name, 'macos-')
        run: |
          set -euo pipefail
          mkdir -p package

          APP="package/FCAE VPN.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Frameworks"
          mkdir -p "$APP/Contents/Resources"

          cp build/fcaevpn "$APP/Contents/MacOS/fcaevpn"
          chmod +x "$APP/Contents/MacOS/fcaevpn"
          if [ -f build/libfcae_psiphon.dylib ]; then
            cp build/libfcae_psiphon.dylib "$APP/Contents/MacOS/"
          fi
          if [ -f build/fcae-psiphon-console ]; then
            cp build/fcae-psiphon-console "$APP/Contents/MacOS/"
          fi

          # ── App icon ────────────────────────────────────────────────
          # Build a real .icns from src_cpp/icon_48.png. Finder and the Dock
          # ignore a bare .png referenced by CFBundleIconFile, which is why the
          # app previously showed the blank generic icon.
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"

          gen() { sips -s format png -z "$1" "$1" src_cpp/icon_48.png --out "$ICONSET/$2" >/dev/null; }
          gen 16  icon_16x16.png
          gen 32  icon_16x16@2x.png
          gen 32  icon_32x32.png
          gen 64  icon_32x32@2x.png
          gen 128 icon_128x128.png
          gen 256 icon_128x128@2x.png

          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          cp src_cpp/icon_48.png "$APP/Contents/Resources/AppIcon.png"
          ls -la "$APP/Contents/Resources/"

          echo "Binary dynamic dependencies:"
          otool -L "$APP/Contents/MacOS/fcaevpn" || true

          # Strip leading 'v' from release_tag for macOS version (must be x.y.z format)
          RAW_TAG="${{ github.event.inputs.release_tag }}"
          MACOS_VER="${RAW_TAG#v}"
          # If MACOS_VER has more than 3 dots (e.g. 1.0.9.4), use only first 3 components
          MACOS_VER=$(echo "$MACOS_VER" | awk -F. '{if(NF>3) print $1"."$2"."$3; else print $0}')
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleExecutable</key>' \
            '    <string>fcaevpn</string>' \
            '    <key>CFBundleIdentifier</key>' \
            '    <string>com.fc.fcaevpn</string>' \
            '    <key>CFBundleName</key>' \
            '    <string>FCAE VPN</string>' \
            '    <key>CFBundleVersion</key>' \
            '    <string>'"${MACOS_VER}"'</string>' \
            '    <key>CFBundleShortVersionString</key>' \
            '    <string>'"${MACOS_VER}"'</string>' \
            '    <key>CFBundlePackageType</key>' \
            '    <string>APPL</string>' \
            '    <key>CFBundleIconFile</key>' \
            '    <string>AppIcon.icns</string>' \
            '    <key>CFBundleIconName</key>' \
            '    <string>AppIcon</string>' \
            '    <key>CFBundleDisplayName</key>' \
            '    <string>FCAE VPN</string>' \
            '    <key>CFBundleInfoDictionaryVersion</key>' \
            '    <string>6.0</string>' \
            '    <key>CFBundleSignature</key>' \
            '    <string>????</string>' \
            '    <key>LSApplicationCategoryType</key>' \
            '    <string>public.app-category.utilities</string>' \
            '    <key>NSPrincipalClass</key>' \
            '    <string>NSApplication</string>' \
            '    <key>NSHighResolutionCapable</key>' \
            '    <true/>' \
            '    <key>LSMinimumSystemVersion</key>' \
            '    <string>13.0</string>' \
            '</dict>' \
            '</plist>' > "$APP/Contents/Info.plist"

          # Bump the bundle mtime so Finder/LaunchServices does not serve a
          # stale (icon-less) cache entry for this bundle identifier.
          touch "$APP"

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            codesign --force --deep --sign "FC" --keychain "$KEYCHAIN_PATH" --timestamp "$APP" || \
              codesign --force --deep --sign "FC" --keychain "$KEYCHAIN_PATH" "$APP"
          else
            echo "No signing keychain found, falling back to ad-hoc signing"
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP" || true

          # Stage a clean DMG root: the .app plus an /Applications drop target.
          DMG_ROOT="$RUNNER_TEMP/dmgroot"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          cp -R "$APP" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"

          DMG_NAME="FCAE_VPN-${{ matrix.name }}.dmg"
          hdiutil create -volname "FCAE VPN" -srcfolder "$DMG_ROOT" -ov -format UDZO "package/${DMG_NAME}"

          ls -lah package/
          test -f "package/${DMG_NAME}"

      - name: cleanup macos keychain
        if: always() && startsWith(matrix.name, 'macos-')
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: FCAE_VPN-${{ matrix.name }}
          path: ${{ startsWith(matrix.name, 'macos-') && 'package/*.dmg' || 'package/*' }}
          if-no-files-found: error

  release:
    name: release/pre-release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: download app package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: FCAE_VPN-*
          path: artifacts/
          merge-multiple: false

      - name: zip for GitHub Release
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
            echo "waiting for boot-time apt processes to release locks..."
            sleep 5
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y zip
          mkdir -p release-zips
          for dir in artifacts/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              suffix="-prerelease"
            else
              suffix=""
            fi
            # macOS artifacts contain only the .dmg â€” copy it directly (already compressed)
            if ls "$dir"/*.dmg 1>/dev/null 2>&1; then
              for dmg in "$dir"/*.dmg; do
                dmg_base=$(basename "$dmg" .dmg)
                cp "$dmg" "release-zips/${dmg_base}${suffix}.dmg"
                echo "Copied release-zips/${dmg_base}${suffix}.dmg"
              done
            else
              zip_name="${name}${suffix}.zip"
              (
                cd "$dir"
                zip -9 -j "../../release-zips/${zip_name}" ./*
              )
              echo "Created release-zips/${zip_name}"
              unzip -l "release-zips/${zip_name}" | head -20
            fi
          done
          ls -lah release-zips/
          test $(ls -1 release-zips/* 2>/dev/null | wc -l) -ge 1

      - name: delete existing release + tag
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            const tag = ${{ toJSON(inputs.release_tag) }};
            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner, repo: context.repo.repo, release_id: rel.data.id
              });
              console.log(`Deleted release ${rel.data.id} for tag ${tag}`);
            } catch (e) { console.log(`No existing release: ${e.message}`); }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`
              });
            } catch (e) { console.log(`No existing tag: ${e.message}`); }

      - name: release/pre-release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tag = ${{ toJSON(inputs.release_tag) }};
            const isPrerelease = ${{ inputs.prerelease }};
            const extraNotes = ${{ toJSON(inputs.extra_notes) }};

            // Compare the numeric base of two version strings (ignoring the
            // leading v and any -prerelease/+build suffix); returns true when
            // the first base is strictly newer.
            const baseKey = (v) => String(v).replace(/^[vV]/, '').split(/[-+]/)[0].split('.')
              .map((n) => parseInt(n, 10) || 0);
            const baseNewer = (a, b) => {
              const ka = baseKey(a), kb = baseKey(b);
              for (let i = 0; i < 4; i++) {
                const d = (ka[i] || 0) - (kb[i] || 0);
                if (d !== 0) return d > 0;
              }
              return false;
            };

            // Release notes = what was typed into the workflow input. The
            // auto-generated changelog ("Full Changelog" compare link + raw
            // commit titles) is only a fallback for when the input is empty,
            // it never mixes in with typed notes.
            let changelog = '';
            try {
              const notes = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
              });
              changelog = notes.data.body;
            } catch (e) {
              console.log(`Could not generate release notes: ${e.message}`);
            }

            const body = (extraNotes || '').trim() ? extraNotes.trim() : changelog;

            const release = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: tag,
            target_commitish: context.sha,
            name: `FCAE VPN ${tag}`,
            body,
            prerelease: isPrerelease,
            draft: false,
            });
            console.log(`Created release ${release.data.id} for tag ${tag} (prerelease=${isPrerelease})`);

            // Upload every file in release-zips as a release asset
            const dir = 'release-zips';
            for (const file of fs.readdirSync(dir)) {
              const filePath = path.join(dir, file);
              const data = fs.readFileSync(filePath);
              const ext = path.extname(file).toLowerCase();
              const contentType = ext === '.dmg' ? 'application/x-apple-diskimage'
                                : ext === '.zip' ? 'application/zip'
                                : 'application/octet-stream';
              console.log(`Uploading ${file} (${data.length} bytes, type=${contentType})...`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: file,
                data,
                headers: {
                  'content-type': contentType,
                  'content-length': data.length,
                },
              });
            }
            console.log('All assets uploaded.');

            // Publish update metadata only after every asset uploaded successfully.
            // Use the Contents API to commit just this file without pushing a
            // stale checkout.
            //
            // version.json is a TWO-SLOT manifest (see
            // core/Aether/src/version_checker.rs): the top level is always the
            // latest STABLE release, the optional `prerelease` block is the
            // latest pre-release, and `type` tells the client which is which.
            // A pre-release run must never overwrite the stable slot — that
            // is what used to hide the last stable release from stable users.
            // The top-level keys must stay BEFORE the prerelease block: CMake
            // and Gradle read the first "version" match of this file.
            const entry = {
              type: isPrerelease ? 'pre-release' : 'release',
              version: isPrerelease ? `${tag}-prerelease` : tag,
              release_date: (release.data.published_at || new Date().toISOString()).slice(0, 10),
              release_notes: body,
              download_url: release.data.html_url,
            };

            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'version.json',
              ref: 'main',
            });
            if (Array.isArray(current.data) || current.data.type !== 'file') {
              throw new Error('Expected version.json to be a file on main');
            }
            let previous = {};
            try {
              previous = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            } catch (e) {
              console.log(`Existing version.json is not valid JSON, rewriting it: ${e.message}`);
            }

            const next = {};
            if (isPrerelease) {
              // Only the pre-release slot moves; the stable slot is kept
              // verbatim so stable clients keep seeing the last stable.
              for (const key of ['type', 'version', 'release_date', 'release_notes', 'download_url']) {
                if (previous[key] !== undefined) next[key] = previous[key];
              }
              next.prerelease = entry;
            } else {
              next.type = 'release';
              next.version = entry.version;
              next.release_date = entry.release_date;
              next.release_notes = entry.release_notes;
              next.download_url = entry.download_url;
