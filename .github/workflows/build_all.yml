name: Clubapp APK (v7a)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Clubapp android-v7a
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FCAE_VERSION: "1.0.0"
      FCAE_VERSION_FULL: "1.0.0"
      FCAE_IS_PRERELEASE: "false"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: s
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: ensure submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: apply Clubapp branding
        run: |
          set -euo pipefail
          pip install pillow numpy
          python3 - <<'PY'
          import os, re
          from PIL import Image, ImageDraw, ImageFont
          import numpy as np

          ROOT = "android/app/src/main"
          RES = ROOT + "/res"
          TG = "https://t.me/Clubapp8"
          DEAD = "http://127.0.0.1:9/disabled"

          # ساخت آیکون ساده شبیه لوگوی Clubapp
          def make_icon(size=512):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              for y in range(size):
                  r = int(88 + (30 - 88) * y / size)
                  g = int(28 + (80 - 28) * y / size)
                  b = int(135 + (200 - 135) * y / size)
                  draw.line([(0, y), (size, y)], fill=(r, g, b, 255))
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", size // 5)
              except:
                  font = ImageFont.load_default()
              text = "Clubapp"
              bbox = draw.textbbox((0, 0), text, font=font)
              tw = bbox[2] - bbox[0]
              th = bbox[3] - bbox[1]
              draw.text(((size - tw) // 2, (size - th) // 2), text, fill="white", font=font)
              return img

          src = make_icon(512)

          def sized(n):
              return src.resize((n, n), Image.LANCZOS)

          def round_img(n):
              im = sized(n)
              m = Image.new("L", (n * 4, n * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, n * 4 - 1, n * 4 - 1), fill=255)
              m = np.array(m.resize((n, n), Image.LANCZOS))
              a = np.minimum(np.array(im)[..., 3], m)
              im.putalpha(Image.fromarray(a.astype(np.uint8)))
              return im

          bg = "#1E3A8A"

          DENS = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          names = {"ic_launcher", "ic_launcher_round"}
          try:
              man = open(ROOT + "/AndroidManifest.xml", encoding="utf-8").read()
              names |= set(re.findall(r'android:(?:icon|roundIcon)="@mipmap/([^"]+)"', man))
          except:
              pass

          for d in os.listdir(RES):
              if d.startswith("mipmap"):
                  for n in names:
                      for ext in (".png", ".webp", ".jpg"):
                          p = os.path.join(RES, d, n + ext)
                          if os.path.exists(p):
                              os.remove(p)

          for n in sorted(names):
              for dens, px in DENS.items():
                  dd = os.path.join(RES, "mipmap-" + dens)
                  os.makedirs(dd, exist_ok=True)
                  img = round_img(px) if "round" in n else sized(px)
                  img.save(os.path.join(dd, n + ".png"), optimize=True)

          os.makedirs(RES + "/drawable-nodpi", exist_ok=True)
          sized(324).save(RES + "/drawable-nodpi/clubapp_icon_fg.png", optimize=True)
          os.makedirs(RES + "/values", exist_ok=True)
          open(RES + "/values/clubapp_icon.xml", "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="clubapp_icon_bg">' + bg + '</color>\n'
              '</resources>\n'
          )

          ADAPTIVE = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/clubapp_icon_bg"/>\n'
              '    <foreground android:drawable="@drawable/clubapp_icon_fg"/>\n'
              '</adaptive-icon>\n'
          )

          v26 = os.path.join(RES, "mipmap-anydpi-v26")
          os.makedirs(v26, exist_ok=True)
          for n in sorted(names):
              open(os.path.join(v26, n + ".xml"), "w").write(ADAPTIVE)

          # تغییر اسم + لینک‌ها + غیرفعال کردن آپدیت
          APPNAME = re.compile(r'(<string\s+name="app_name"[^>]*>)[^<]*(</string>)')
          PAGE = re.compile(r'https?://(?:www\.)?github\.com/FCFlenkchy[^\s"\')\\]*', re.I)
          API = re.compile(r'https?://api\.github\.com[^\s"\')\\]*', re.I)
          REL = re.compile(r'https?://(?:www\.)?github\.com/[^\s"\')\\]*(?:releases|/tags)[^\s"\')\\]*', re.I)
          TME = re.compile(r'https?://t\.me/[A-Za-z0-9_+]+')

          for d, dirs, files in os.walk(ROOT):
              dirs[:] = [x for x in dirs if x not in {"build", ".gradle", "node_modules", ".git"}]
              for f in files:
                  if not f.endswith((".xml", ".kt", ".java")):
                      continue
                  p = os.path.join(d, f)
                  try:
                      t = open(p, encoding="utf-8").read()
                  except:
                      continue
                  n = t.replace("FCAE VPN", "Clubapp")
                  n = APPNAME.sub(r"\1Clubapp\2", n)
                  n = API.sub(DEAD, n)
                  n = REL.sub(DEAD, n)
                  n = PAGE.sub(TG, n)
                  n = TME.sub(TG, n)
                  n = re.sub(r"FCFlenkchy/FCAE_VPN", "none/none", n, flags=re.I)
                  if f == "AndroidManifest.xml":
                      n = re.sub(r'\s*<uses-permission[^>]*REQUEST_INSTALL_PACKAGES[^>]*/>', "", n)
                  if n != t:
                      open(p, "w", encoding="utf-8").write(n)

          # تغییر version.json
          with open("version.json", "w", encoding="utf-8") as f:
              f.write('''[
  {
    "version": "1.0.0",
    "date": "2026-09-21",
    "notes": "Clubapp - No updates",
    "url": "https://t.me/Clubapp8"
  }
]
''')
          print("Branding finished successfully")
          PY

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'core/psiphon/go.mod'
          cache: false

      - name: pin go toolchain
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          echo "GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
          go version

      - name: setup ndk
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi
          components: rust-src

      - name: Build Psiphon AAR (v7a only)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          PSIPHON_REV=$(git rev-parse HEAD:core/psiphon)
          PSIPHON_GIT_DIR=$(git -C core/psiphon rev-parse --absolute-git-dir)
          docker build --platform=linux/amd64 -t fcae-psiphon-android \
            -f core/psiphon/MobileLibrary/Android/Dockerfile core/psiphon/MobileLibrary
          docker run --platform=linux/amd64 --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GOCACHE=/tmp/go-cache \
            -e GIT_DIR=/psiphon-git \
            -e GIT_WORK_TREE=/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core \
            -e PSIPHON_REV="$PSIPHON_REV" \
            -v "$PSIPHON_GIT_DIR:/psiphon-git:ro" \
            -v "$ROOT/core/psiphon:/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core" \
            fcae-psiphon-android /bin/bash -c '
              set -euo pipefail
              cd "$GIT_WORK_TREE/MobileLibrary/Android"
              ./make.bash
            '
          mkdir -p android/psiphon/libs
          cp core/psiphon/MobileLibrary/Android/ca.psiphon.aar android/psiphon/libs/
          zip -d android/psiphon/libs/ca.psiphon.aar 'jni/arm64-v8a/*' 'jni/x86/*' 'jni/x86_64/*' || true

      - name: fetch imgui
        run: |
          mkdir -p third_party
          if [ ! -d "third_party/imgui" ]; then
            git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git third_party/imgui
          fi

      - name: setup zig
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VER=0.16.0
          ARCHIVE="zig-x86_64-linux-${ZIG_VER}.tar.xz"
          PREFIX="${RUNNER_TOOL_CACHE}/zig-${ZIG_VER}"
          mkdir -p "$PREFIX"
          if [ ! -x "${PREFIX}/zig" ]; then
            curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VER}/${ARCHIVE}"
            tar -xJf /tmp/zig.tar.xz -C "$PREFIX" --strip-components=1
          fi
          echo "$PREFIX" >> "$GITHUB_PATH"
          zig version

      - name: build zeptun (v7a)
        shell: bash
        run: |
          set -euo pipefail
          cd core/zeptun
          SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIBC_DIR=$(mktemp -d)
          abi=armeabi-v7a
          ZIG_TARGET=arm-linux-androideabi.24
          NDK_TARGET=arm-linux-androideabi
          printf '%s\n' \
            "include_dir=$SYSROOT/usr/include" \
            "sys_include_dir=$SYSROOT/usr/include/$NDK_TARGET" \
            "crt_dir=$SYSROOT/usr/lib/$NDK_TARGET/24" \
            'msvc_lib_dir=' 'kernel32_lib_dir=' 'gcc_dir=' > "$LIBC_DIR/$abi.conf"
          zig build -Dtarget="$ZIG_TARGET" -Doptimize=ReleaseSmall -Dstrip=true \
            -Dandroid-libc="$LIBC_DIR/$abi.conf" --libc "$LIBC_DIR/$abi.conf" \
            --prefix "$PWD/zig-out/android/$abi"
          install -D -m 644 "zig-out/android/$abi/lib/libzeptun.a" \
            "zig-out/android/prebuilt/$abi/libzeptun.a"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build hev-socks5-tunnel (v7a)
        shell: bash
        run: |
          set -euo pipefail
          cd core/hev-socks5-tunnel
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          make clean
          make static \
            CC="$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang" \
            AR="$TOOLCHAIN/bin/llvm-ar" \
            STRIP="$TOOLCHAIN/bin/llvm-strip" \
            PP="$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang -E" \
            CFLAGS="-fPIC -DFD_SET_DEFINED -DSOCKLEN_T_DEFINED -Wno-error -mfpu=neon"
          mkdir -p bin/android/armeabi-v7a
          cp bin/libhev-socks5-tunnel.a \
             third-part/lwip/bin/liblwip.a \
             third-part/yaml/bin/libyaml.a \
             third-part/hev-task-system/bin/libhev-task-system.a \
             bin/android/armeabi-v7a/
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build rust (v7a only)
        run: |
          set -euo pipefail
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          PREBUILT="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$PREBUILT/bin"
          export PATH="$BIN:$PATH"
          export ANDROID_NDK_HOME="$NDK"
          TARGET_TRIPLE=armv7-linux-androideabi
          CLANG="$BIN/armv7a-linux-androideabi24-clang"
          export CC_armv7_linux_androideabi="$CLANG"
          export CXX_armv7_linux_androideabi="$BIN/armv7a-linux-androideabi24-clang++"
          export AR_armv7_linux_androideabi="$BIN/llvm-ar"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$CLANG"
          export FCAE_HEV_LIBDIR="$(pwd)/core/hev-socks5-tunnel/bin/android/armeabi-v7a"
          export FCAE_ZEPTUN_LIBDIR="$(pwd)/core/zeptun/zig-out/android/prebuilt/armeabi-v7a"
          cargo build --manifest-path core/fcae-ffi/Cargo.toml --release --target "$TARGET_TRIPLE" \
            -p fcae-ffi --features aether,tor,psiphon,zeptun,hev
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build apk (v7a only)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
            unzip -q tools.zip
            mv cmdline-tools latest
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

          cat > /tmp/v7a.init.gradle <<'GRADLE'
          allprojects {
              plugins.withId('com.android.application') {
                  androidComponents.finalizeDsl { dsl ->
                      try {
                          dsl.defaultConfig.ndk.abiFilters.clear()
                          dsl.defaultConfig.ndk.abiFilters.add('armeabi-v7a')
                          dsl.packaging.jniLibs.useLegacyPackaging = true
                      } catch (Throwable t) {}
                  }
              }
          }
          GRADLE

          cd android
          gradle wrapper --gradle-version 9.6.0
          ./gradlew -I /tmp/v7a.init.gradle assembleRelease \
            -PUNIVERSAL=true -PBUILD_TYPE=android_universal \
            -Pandroid.injected.build.abi=armeabi-v7a

      - name: strip other ABIs + sign
        run: |
          set -euo pipefail
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/*/ | sort -V | tail -1)
          APKPATH=$(find android -path '*/build/outputs/*' -name '*.apk' | grep -v -i debug | head -1)
          cp "$APKPATH" /tmp/in.apk
          zip -d /tmp/in.apk 'lib/arm64-v8a/*' 'lib/x86/*' 'lib/x86_64/*' || true
          zip -d /tmp/in.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' || true
          "${BT}zipalign" -f -p 4 /tmp/in.apk /tmp/aligned.apk
          keytool -genkeypair -keystore /tmp/clubapp.keystore -alias clubapp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass clubapp-pass -keypass clubapp-pass -dname "CN=Clubapp"
          "${BT}apksigner" sign \
            --ks /tmp/clubapp.keystore \
            --ks-pass pass:clubapp-pass \
            --key-pass pass:clubapp-pass \
            --ks-key-alias clubapp \
            --out /tmp/Clubapp-v7a.apk /tmp/aligned.apk
          mkdir -p package
          cp /tmp/Clubapp-v7a.apk package/
          ls -lah package/

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: Clubapp-apk-v7a
          path: package/*
          if-no-files-found: error
