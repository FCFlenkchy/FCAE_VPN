name: Clubapp APK (v8a)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Clubapp android-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FCAE_VERSION: "1.0.0"
      FCAE_VERSION_FULL: "1.0.0"
      FCAE_IS_PRERELEASE: "false"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: s
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: ensure submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: apply Clubapp branding
        run: |
          set -euo pipefail
          pip install pillow numpy
          python3 - <<'PY'
          import os, re, json, io, base64
          from PIL import Image, ImageDraw, ImageFont
          import numpy as np

          ROOT = "android/app/src/main"
          RES = ROOT + "/res"
          TG = "https://t.me/Clubapp8"
          DEAD = "http://127.0.0.1:9/disabled"

          # آیکون Clubapp (فایل icon.ico فقط ۳۲ پیکسل است؛ از آن فقط رنگ‌ها و گرادیان پس‌زمینه گرفته می‌شود
          # و نوشته‌ی Clubapp با فونت بولد و تیز، داخل ناحیه‌ی امن آیکون رسم می‌شود تا بریده نشود)
          ICON_B64 = ""

          FONT_PATHS = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
          ]

          def load_bg():
              im = Image.open(io.BytesIO(base64.b64decode(ICON_B64)))
              sizes = im.info.get("sizes")
              if sizes:
                  im.size = max(sizes)
              a = np.array(im.convert("RGB")).astype(np.float64)
              h = a.shape[0]
              top, bot = int(h * 0.30), int(h * 0.78)
              for y in range(top, bot + 1):
                  t = (y - (top - 1)) / ((bot + 1) - (top - 1))
                  a[y] = a[top - 1] * (1 - t) + a[bot + 1] * t
              return Image.fromarray(np.clip(a, 0, 255).astype(np.uint8), "RGB")

          BG_SMALL = load_bg()

          def bg_layer(size):
              return BG_SMALL.resize((size, size), Image.BICUBIC).convert("RGBA")

          def text_layer(size, width_frac, text="Clubapp"):
              ss = 4
              big = size * ss
              lay = Image.new("RGBA", (big, big), (0, 0, 0, 0))
              d = ImageDraw.Draw(lay)
              font_path = next((p for p in FONT_PATHS if os.path.exists(p)), None)
              if font_path is None:
                  f = ImageFont.load_default()
              else:
                  target = big * width_frac
                  fs = 10
                  while True:
                      f = ImageFont.truetype(font_path, fs)
                      b = d.textbbox((0, 0), text, font=f)
                      if b[2] - b[0] >= target:
                          break
                      fs += 2
              b = d.textbbox((0, 0), text, font=f)
              tw, th = b[2] - b[0], b[3] - b[1]
              d.text(((big - tw) // 2 - b[0], (big - th) // 2 - b[1]), text, font=f, fill=(255, 255, 255, 255))
              return lay.resize((size, size), Image.LANCZOS)

          def legacy_icon(size, round_shape):
              img = bg_layer(size)
              img.alpha_composite(text_layer(size, 0.72 if round_shape else 0.80))
              if round_shape:
                  m = Image.new("L", (size * 4, size * 4), 0)
                  ImageDraw.Draw(m).ellipse((0, 0, size * 4 - 1, size * 4 - 1), fill=255)
                  img.putalpha(m.resize((size, size), Image.LANCZOS))
              return img

          bg = "#1E3A8A"

          DENS = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          names = {"ic_launcher", "ic_launcher_round"}
          try:
              man = open(ROOT + "/AndroidManifest.xml", encoding="utf-8").read()
              names |= set(re.findall(r'android:(?:icon|roundIcon)="@mipmap/([^"]+)"', man))
          except:
              pass

          for d in os.listdir(RES):
              if d.startswith("mipmap"):
                  for n in names:
                      for ext in (".png", ".webp", ".jpg"):
                          p = os.path.join(RES, d, n + ext)
                          if os.path.exists(p):
                              os.remove(p)

          for n in sorted(names):
              for dens, px in DENS.items():
                  dd = os.path.join(RES, "mipmap-" + dens)
                  os.makedirs(dd, exist_ok=True)
                  img = legacy_icon(px, "round" in n)
                  img.save(os.path.join(dd, n + ".png"), optimize=True)

          os.makedirs(RES + "/drawable-nodpi", exist_ok=True)
          bg_layer(432).convert("RGB").save(RES + "/drawable-nodpi/clubapp_icon_bg_grad.png", optimize=True)
          text_layer(432, 0.60).save(RES + "/drawable-nodpi/clubapp_icon_fg.png", optimize=True)
          os.makedirs(RES + "/values", exist_ok=True)
          open(RES + "/values/clubapp_icon.xml", "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="clubapp_icon_bg">' + bg + '</color>\n'
              '</resources>\n'
          )

          ADAPTIVE = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@drawable/clubapp_icon_bg_grad"/>\n'
              '    <foreground android:drawable="@drawable/clubapp_icon_fg"/>\n'
              '</adaptive-icon>\n'
          )

          v26 = os.path.join(RES, "mipmap-anydpi-v26")
          os.makedirs(v26, exist_ok=True)
          for n in sorted(names):
              open(os.path.join(v26, n + ".xml"), "w").write(ADAPTIVE)

          # تغییر اسم + لینک‌ها + غیرفعال کردن آپدیت
          APPNAME = re.compile(r'(<string\s+name="app_name"[^>]*>)[^<]*(</string>)')
          PAGE = re.compile(r'https?://(?:www\.)?github\.com/FCFlenkchy[^\s"\')\\]*', re.I)
          API = re.compile(r'https?://api\.github\.com[^\s"\')\\]*', re.I)
          REL = re.compile(r'https?://(?:www\.)?github\.com/[^\s"\')\\]*(?:releases|/tags)[^\s"\')\\]*', re.I)
          TME = re.compile(r'https?://t\.me/[A-Za-z0-9_+]+')

          for d, dirs, files in os.walk(ROOT):
              dirs[:] = [x for x in dirs if x not in {"build", ".gradle", "node_modules", ".git"}]
              for f in files:
                  if not f.endswith((".xml", ".kt", ".java")):
                      continue
                  p = os.path.join(d, f)
                  try:
                      t = open(p, encoding="utf-8").read()
                  except:
                      continue
                  n = t.replace("FCAE VPN", "Clubapp")
                  n = APPNAME.sub(r"\1Clubapp\2", n)
                  n = API.sub(DEAD, n)
                  n = REL.sub(DEAD, n)
                  n = PAGE.sub(TG, n)
                  n = TME.sub(TG, n)
                  n = re.sub(r"FCFlenkchy/FCAE_VPN", "none/none", n, flags=re.I)
                  if f == "AndroidManifest.xml":
                      n = re.sub(r'\s*<uses-permission[^>]*REQUEST_INSTALL_PACKAGES[^>]*/>', "", n)
                  if n != t:
                      open(p, "w", encoding="utf-8").write(n)

          # تغییر version.json
          version_info = [{
              "version": "1.0.0",
              "date": "2026-09-21",
              "notes": "Clubapp - No updates",
              "url": TG,
          }]
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(version_info, f, indent=2, ensure_ascii=False)
          print("Branding finished successfully")
          PY

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'core/psiphon/go.mod'
          cache: false

      - name: pin go toolchain
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          echo "GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
          go version

      - name: setup ndk
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rust-src

      - name: Build Psiphon AAR (v8a only)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          PSIPHON_REV=$(git rev-parse HEAD:core/psiphon)
          PSIPHON_GIT_DIR=$(git -C core/psiphon rev-parse --absolute-git-dir)
          docker build --platform=linux/amd64 -t fcae-psiphon-android \
            -f core/psiphon/MobileLibrary/Android/Dockerfile core/psiphon/MobileLibrary
          docker run --platform=linux/amd64 --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GOCACHE=/tmp/go-cache \
            -e GIT_DIR=/psiphon-git \
            -e GIT_WORK_TREE=/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core \
            -e PSIPHON_REV="$PSIPHON_REV" \
            -v "$PSIPHON_GIT_DIR:/psiphon-git:ro" \
            -v "$ROOT/core/psiphon:/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core" \
            fcae-psiphon-android /bin/bash -c '
              set -euo pipefail
              cd "$GIT_WORK_TREE/MobileLibrary/Android"
              ./make.bash
            '
          mkdir -p android/psiphon/libs
          cp core/psiphon/MobileLibrary/Android/ca.psiphon.aar android/psiphon/libs/
          zip -d android/psiphon/libs/ca.psiphon.aar 'jni/armeabi-v7a/*' 'jni/x86/*' 'jni/x86_64/*' || true

      - name: fetch imgui
        run: |
          mkdir -p third_party
          if [ ! -d "third_party/imgui" ]; then
            git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git third_party/imgui
          fi

      - name: setup zig
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VER=0.16.0
          ARCHIVE="zig-x86_64-linux-${ZIG_VER}.tar.xz"
          PREFIX="${RUNNER_TOOL_CACHE}/zig-${ZIG_VER}"
          mkdir -p "$PREFIX"
          if [ ! -x "${PREFIX}/zig" ]; then
            curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VER}/${ARCHIVE}"
            tar -xJf /tmp/zig.tar.xz -C "$PREFIX" --strip-components=1
          fi
          echo "$PREFIX" >> "$GITHUB_PATH"
          export PATH="$PREFIX:$PATH"
          zig version

      - name: build zeptun (v8a)
        shell: bash
        run: |
          set -euo pipefail
          cd core/zeptun
          SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIBC_DIR=$(mktemp -d)
          abi=arm64-v8a
          ZIG_TARGET=aarch64-linux-android.24
          NDK_TARGET=aarch64-linux-android
          printf '%s\n' \
            "include_dir=$SYSROOT/usr/include" \
            "sys_include_dir=$SYSROOT/usr/include/$NDK_TARGET" \
            "crt_dir=$SYSROOT/usr/lib/$NDK_TARGET/24" \
            'msvc_lib_dir=' 'kernel32_lib_dir=' 'gcc_dir=' > "$LIBC_DIR/$abi.conf"
          zig build -Dtarget="$ZIG_TARGET" -Doptimize=ReleaseSmall -Dstrip=true \
            -Dandroid-libc="$LIBC_DIR/$abi.conf" --libc "$LIBC_DIR/$abi.conf" \
            --prefix "$PWD/zig-out/android/$abi"
          install -D -m 644 "zig-out/android/$abi/lib/libzeptun.a" \
            "zig-out/android/prebuilt/$abi/libzeptun.a"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build hev-socks5-tunnel (v8a)
        shell: bash
        run: |
          set -euo pipefail
          cd core/hev-socks5-tunnel
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          make clean
          make static \
            CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang" \
            AR="$TOOLCHAIN/bin/llvm-ar" \
            STRIP="$TOOLCHAIN/bin/llvm-strip" \
            PP="$TOOLCHAIN/bin/aarch64-linux-android24-clang -E" \
            CFLAGS="-fPIC -DFD_SET_DEFINED -DSOCKLEN_T_DEFINED -Wno-error"
          mkdir -p bin/android/arm64-v8a
          cp bin/libhev-socks5-tunnel.a \
             third-part/lwip/bin/liblwip.a \
             third-part/yaml/bin/libyaml.a \
             third-part/hev-task-system/bin/libhev-task-system.a \
             bin/android/arm64-v8a/
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: patch bridges for android (platform module)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re

          BASE = "core/fcae-ffi/bridges/"

          def read(p):
              return open(p, encoding="utf-8").read()

          def write(p, s):
              open(p, "w", encoding="utf-8").write(s)

          # hev-socks5-tunnel: platform فقط برای ویندوز تعریف شده؛ برای بقیه یک نسخه ساده اضافه می‌کنیم
          p = BASE + "hev-socks5-tunnel/src/lib.rs"
          s = read(p)
          stub = "\n#[cfg(not(windows))]\npub mod platform {\n    pub fn is_privileged() -> bool {\n        true\n    }\n}\n"
          if "#[cfg(not(windows))]\npub mod platform" not in s:
              s, n = re.subn(r"(#\[cfg\(windows\)\]\s*mod platform;)", lambda m: m.group(1) + stub, s, count=1)
              if n != 1:
                  raise SystemExit("pattern not found in hev lib.rs")
          s = re.sub(r"(?m)^mod platform", "pub mod platform", s)
          write(p, s)

          # zeptun: ماژول platform باید public باشد چون ffi ازش استفاده می‌کند
          p = BASE + "zeptun/src/lib.rs"
          s = read(p)
          s, n = re.subn(r"(?m)^mod platform", "pub mod platform", s)
          write(p, s)
          print("patched")
          PY

      - name: build rust (v8a only)
        run: |
          set -euo pipefail
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          PREBUILT="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$PREBUILT/bin"
          export PATH="$BIN:$PATH"
          export ANDROID_NDK_HOME="$NDK"
          TARGET_TRIPLE=aarch64-linux-android
          CLANG="$BIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$CLANG"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"
          export FCAE_HEV_LIBDIR="$(pwd)/core/hev-socks5-tunnel/bin/android/arm64-v8a"
          export FCAE_ZEPTUN_LIBDIR="$(pwd)/core/zeptun/zig-out/android/prebuilt/arm64-v8a"
          cargo build --manifest-path core/fcae-ffi/Cargo.toml --release --target "$TARGET_TRIPLE" \
            -p fcae-ffi --features aether,tor,psiphon,zeptun,hev
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build apk (v8a only)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
            unzip -q tools.zip
            mv cmdline-tools latest
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

          cat > /tmp/v8a.init.gradle <<'GRADLE'
          allprojects {
              plugins.withId('com.android.application') {
                  androidComponents.finalizeDsl { dsl ->
                      try {
                          dsl.defaultConfig.ndk.abiFilters.clear()
                          dsl.defaultConfig.ndk.abiFilters.add('arm64-v8a')
                          dsl.packaging.jniLibs.useLegacyPackaging = true
                      } catch (Throwable t) {}
                  }
              }
          }
          GRADLE

          cd android
          gradle wrapper --gradle-version 9.6.0
          ./gradlew -I /tmp/v8a.init.gradle assembleRelease \
            -PUNIVERSAL=true -PBUILD_TYPE=android_universal \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: strip other ABIs + sign
        run: |
          set -euo pipefail
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "--- all APK files in workspace ---"
          find . -name '*.apk' -not -path './third_party/*' || true
          echo "----------------------------------"
          APKPATH=$(find android -name '*.apk' 2>/dev/null | grep -v -i debug | grep -i release | head -1 || true)
          if [ -z "$APKPATH" ]; then
            echo "::error::No release APK found under android/"
            find android -path '*/outputs/*' -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          echo "Using APK: $APKPATH"
          cp "$APKPATH" /tmp/in.apk
          zip -d /tmp/in.apk 'lib/armeabi-v7a/*' 'lib/x86/*' 'lib/x86_64/*' || true
          zip -d /tmp/in.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' || true
          "${BT}zipalign" -f -p 4 /tmp/in.apk /tmp/aligned.apk
          keytool -genkeypair -keystore /tmp/clubapp.keystore -alias clubapp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass clubapp-pass -keypass clubapp-pass -dname "CN=Clubapp"
          "${BT}apksigner" sign \
            --ks /tmp/clubapp.keystore \
            --ks-pass pass:clubapp-pass \
            --key-pass pass:clubapp-pass \
            --ks-key-alias clubapp \
            --out /tmp/Clubapp-v8a.apk /tmp/aligned.apk
          echo "--- verify signature ---"
          "${BT}apksigner" verify --verbose --print-certs /tmp/Clubapp-v8a.apk || true
          echo "--- apk info ---"
          "${BT}aapt2" dump badging /tmp/Clubapp-v8a.apk | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" || true
          echo "--- native libs ---"
          unzip -l /tmp/Clubapp-v8a.apk | grep -E " lib/" || true
          mkdir -p package
          cp /tmp/Clubapp-v8a.apk package/
          ls -lah package/

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: Clubapp-apk-v8a
          path: package/*
          if-no-files-found: error
