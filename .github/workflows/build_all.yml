name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'version'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'pre-release'
        required: false
        default: 'true'
        type: boolean
      publish:
        description: 'publish'
        required: false
        default: false
        type: boolean
      extra_notes:
        description: 'notes'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: resolve release/pre-release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_full: ${{ steps.version.outputs.version_full }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      macos_version: ${{ steps.version.outputs.macos_version }}
      android_version_code: ${{ steps.android.outputs.version_code }}
    steps:
      - name: checkout workflow scripts
        uses: actions/checkout@v7

      - name: validate version and channel
        id: version
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        with:
          script: "await require('./scripts/ci/prepare/validate-version-and-channel.js')({ github, context, core });"

      - name: resolve android versionCode
        id: android
        uses: actions/github-script@v8
        with:
          script: "await require('./scripts/ci/prepare/resolve-android-versioncode.js')({ github, context, core });"

  build:
    needs: prepare
    env:
      FCAE_VERSION: ${{ needs.prepare.outputs.version_full }}
      FCAE_IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
      FCAE_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
      FCAE_MATRIX_NAME: ${{ matrix.name }}
      FCAE_MATRIX_ABI: ${{ matrix.abi }}
      FCAE_MATRIX_TARGET: ${{ matrix.target }}
      FCAE_CMAKE_ARGS: ${{ matrix.cmake_args }}
      FCAE_MACOS_VERSION: ${{ needs.prepare.outputs.macos_version }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x64
            os: ubuntu-latest
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DAETHER_TARGET=LINUX_X64

          - target: x86_64-pc-windows-gnu
            name: windows-x64
            os: ubuntu-latest
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_SYSTEM_NAME=Windows
              -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
              -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
              -DAETHER_TARGET=WIN_X64

          - target: aarch64-linux-android
            name: android-arm64-v8a
            os: ubuntu-latest
            abi: arm64-v8a
            cmake_args: "-DAETHER_TARGET=ANDROID_ARM64"

          - target: armv7-linux-androideabi
            name: android-armeabi-v7a
            os: ubuntu-latest
            abi: armeabi-v7a
            cmake_args: "-DAETHER_TARGET=ANDROID_ARM32"

          - target: x86_64-linux-android
            name: android-x86_64
            os: ubuntu-latest
            abi: x86_64
            cmake_args: "-DAETHER_TARGET=ANDROID_X86_64"

          - target: x86_64-linux-android
            name: android-universal
            os: ubuntu-latest
            abi: ""
            build_type: android_universal
            cmake_args: "-DAETHER_TARGET=ANDROID_UNIVERSAL"

          - target: aarch64-apple-darwin
            name: macos-arm64
            os: macos-latest
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DAETHER_TARGET=MACOS_ARM64

          - target: x86_64-apple-darwin
            name: macos-x64
            os: macos-latest
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_OSX_ARCHITECTURES=x86_64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
              -DAETHER_TARGET=MACOS_X64

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup Java 17 for Android Gradle Plugin
        if: startsWith(matrix.name, 'android-')
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: ensure submodules
        run: bash -e scripts/ci/build_steps/ensure-submodules.sh

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'core/psiphon/go.mod'
          cache: false

      - name: pin go toolchain
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: bash --noprofile --norc -eo pipefail scripts/ci/build_steps/pin-go-toolchain.sh

      - name: cleanup old caches
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: "await require('./scripts/ci/build_steps/cleanup-old-caches.js')({ github, context, core });"

      - name: install deps (linux)
        if: matrix.name == 'linux-x64'
        timeout-minutes: 15
        run: bash -e scripts/ci/build_steps/install-deps-linux.sh

      - name: install deps (windows cross)
        if: matrix.name == 'windows-x64'
        timeout-minutes: 15
        run: bash -e scripts/ci/build_steps/install-deps-windows-cross.sh

      - name: cache macos glfw build
        if: startsWith(matrix.name, 'macos-')
        id: cache-glfw
        uses: actions/cache@v6
        with:
          # Workspace-relative: caching an absolute /usr/local path made the
          # macOS runner's gtar fail the restore step outright.
          path: ${{ github.workspace }}/.glfw/${{ matrix.name }}
          key: glfw-3.4-${{ matrix.name }}

      - name: install deps (macOS)
        if: startsWith(matrix.name, 'macos-')
        run: bash -e scripts/ci/build_steps/install-deps-macos.sh

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu, aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, aarch64-apple-darwin, x86_64-apple-darwin
          components: rust-src

      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          workspaces: |
            core/fcae-ffi -> ../../target
          cache-on-failure: true

      - name: cache cmake
        if: "!startsWith(matrix.name, 'android-')"
        uses: actions/cache@v6
        with:
          path: build
          key: cmake-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'core/**', 'src_cpp/**', 'include/**') }}
          restore-keys: cmake-${{ matrix.name }}-

      - name: cache gradle
        if: startsWith(matrix.name, 'android-')
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: setup ndk
        id: setup-ndk
        if: startsWith(matrix.name, 'android-')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: cache zig
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/zig-0.17.1
          key: zig-0.17.1-${{ runner.os }}-${{ runner.arch }}

      - name: setup zig
        shell: bash
        run: bash --noprofile --norc -eo pipefail scripts/ci/build_steps/setup-zig.sh

      - name: build zeptun engine (libzeptun)
        shell: bash
        run: bash --noprofile --norc -eo pipefail scripts/ci/build_steps/build-zeptun-engine-libzeptun.sh

        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build hev-socks5-tunnel engine (libhev-socks5-tunnel)
        shell: bash
        run: bash --noprofile --norc -eo pipefail scripts/ci/build_steps/build-hev-socks5-tunnel-engine-libhev-socks5-tunnel.sh

        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build rust (engine + ffi, in-process)
        run: bash -e scripts/ci/build_steps/build-rust-engine-ffi-in-process.sh

        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          FCAE_NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTFLAGS: ${{ matrix.name == 'windows-x64' && '-C target-feature=+crt-static -C link-args=-static-libgcc -C link-args=-static-libstdc++ -C link-args=-Wl,-Bstatic -C link-args=-lpthread -C link-args=-lwinpthread -C link-args=-Wl,-Bdynamic' || '' }}

      - name: build frontend (linux)
        if: matrix.name == 'linux-x64'
        run: bash -e scripts/ci/build_steps/build-frontend-linux.sh

      - name: build frontend (windows)
        if: matrix.name == 'windows-x64'
        run: bash -e scripts/ci/build_steps/build-frontend-windows.sh

      - name: build frontend (macOS)
        if: startsWith(matrix.name, 'macos-')
        run: bash -e scripts/ci/build_steps/build-frontend-macos.sh

      - name: build apk
        if: startsWith(matrix.name, 'android-')
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: bash -e scripts/ci/build_steps/build-apk.sh

      - name: sign apk
        if: startsWith(matrix.name, 'android-')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash -e scripts/ci/build_steps/sign-apk.sh

      - name: import macos codesigning cert
        if: startsWith(matrix.name, 'macos-')
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: bash -e scripts/ci/build_steps/import-macos-codesigning-cert.sh

      - name: package
        if: "!startsWith(matrix.name, 'android-') && !startsWith(matrix.name, 'macos-')"
        run: bash -e scripts/ci/build_steps/package.sh

      - name: install osslsigncode (windows signing)
        if: matrix.name == 'windows-x64'
        timeout-minutes: 10
        run: bash -e scripts/ci/build_steps/install-osslsigncode-windows-signing.sh

      - name: sign windows exe
        if: matrix.name == 'windows-x64'
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: bash -e scripts/ci/build_steps/sign-windows-exe.sh

      - name: sign linux binaries (gpg)
        if: matrix.name == 'linux-x64'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: bash -e scripts/ci/build_steps/sign-linux-binaries-gpg.sh

      - name: package (android)
        if: startsWith(matrix.name, 'android-')
        run: bash -e scripts/ci/build_steps/package-android.sh

      - name: package (macOS)
        if: startsWith(matrix.name, 'macos-')
        run: bash -e scripts/ci/build_steps/package-macos.sh

      - name: cleanup macos keychain
        if: always() && startsWith(matrix.name, 'macos-')
        run: bash -e scripts/ci/build_steps/cleanup-macos-keychain.sh

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: FCAE_VPN-${{ matrix.name }}
          path: ${{ startsWith(matrix.name, 'macos-') && 'package/*.dmg' || 'package/*' }}
          if-no-files-found: error

  release:
    name: release/pre-release
    needs: [prepare, build]
    env:
      FCAE_VERSION: ${{ needs.prepare.outputs.version_full }}
      FCAE_IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: checkout workflow scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-workflow
          persist-credentials: false

      - name: delete existing release and tag
        uses: actions/github-script@v8
        env:
          VERSION: ${{ needs.prepare.outputs.version_full }}
        with:
          script: "await require('./.ci-workflow/scripts/ci/release/delete-existing-release-and-tag.js')({ github, context, core });"

      - name: download app package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: FCAE_VPN-*
          path: artifacts/
          merge-multiple: false

      - name: zip for GitHub Release
        timeout-minutes: 10
        run: bash -e .ci-workflow/scripts/ci/release/zip-for-github-release.sh

      - name: release/pre-release
        uses: actions/github-script@v8
        env:
          FCAE_RELEASE_NOTES: ${{ inputs.extra_notes }}
        with:
          script: "await require('./.ci-workflow/scripts/ci/release/release-pre-release.js')({ github, context, core });"
