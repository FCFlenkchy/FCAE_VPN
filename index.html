<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAE VPN - Break Through Censorship</title>
    <link rel="icon" type="image/png" href="icon_48.png">
    <style>
        :root {
            --bg: #06060d;
            --surface: #0e0e1a;
            --surface2: #161630;
            --border: #222244;
            --text: #c8c8e0;
            --text2: #7c7ca0;
            --acc: #7c5cfc;
            --acc2: #b4a4ff;
            --grn: #00e676;
            --org: #ff9100;
            --red: #ff5252;
            --cya: #00e5ff;
            --glow: 0 0 30px rgba(124,92,252,0.25);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}
        #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
        .container{max-width:1000px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

        nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(6,6,13,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 0;transition:all .3s}
        .nav-inner{max-width:1000px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
        .nav-logo{font-size:1.25rem;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--cya));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .nav-links{display:flex;gap:20px;list-style:none}
        .nav-links a{color:var(--text2);text-decoration:none;font-size:.85rem;font-weight:500;transition:color .2s}
        .nav-links a:hover{color:var(--acc2)}

        .hero{text-align:center;padding:120px 20px 60px;position:relative}
        .hero::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(124,92,252,.06) 0%,transparent 70%);pointer-events:none}
        .hero-logo{width:96px;height:96px;margin-bottom:28px;animation:float 4s ease-in-out infinite;filter:drop-shadow(var(--glow))}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
        .hero h1{font-size:clamp(2.2rem,5vw,3.5rem);font-weight:900;background:linear-gradient(135deg,#b4a4ff,#7c5cfc,#00e5ff);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradShift 4s ease infinite;margin-bottom:16px;letter-spacing:-1px}
        @keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
        .hero .sub{font-size:1.1rem;color:var(--text2);max-width:600px;margin:0 auto 24px;line-height:1.7}
        .badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
        .badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.8rem;color:var(--text2)}
        .dot{width:8px;height:8px;border-radius:50%}
        .dot.g{background:var(--grn);box-shadow:0 0 8px var(--grn)}
        .dot.p{background:var(--acc);box-shadow:0 0 8px var(--acc)}
        .dot.c{background:var(--cya);box-shadow:0 0 8px var(--cya)}

        section{margin:60px 0}
        .sh{text-align:center;margin-bottom:36px}
        .sh h2{font-size:1.9rem;font-weight:800;color:#e8e8ff;display:inline-block;position:relative}
        .sh h2::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:50px;height:3px;background:var(--acc);border-radius:2px}
        .sh p{color:var(--text2);font-size:.9rem;margin-top:8px}
        h3{font-size:1.15rem;color:#d8d8f0;margin:24px 0 12px}

        .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:24px 0}
        .step-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px 20px;text-align:center;transition:all .3s;position:relative;overflow:hidden}
        .step-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--cya));transform:scaleX(0);transition:transform .3s}
        .step-card:hover::before{transform:scaleX(1)}
        .step-card:hover{border-color:var(--acc);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.4),var(--glow)}
        .step-num{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:800;font-size:1.1rem;margin-bottom:14px;box-shadow:0 4px 15px rgba(124,92,252,.4)}
        .step-card h4{font-size:.9rem;margin-bottom:6px;color:#d8d8f0}
        .step-card p{font-size:.8rem;color:var(--text2)}

        .arch{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;overflow-x:auto}
        .arch pre{font-family:'JetBrains Mono','SF Mono','Fira Code',Consolas,monospace;font-size:.75rem;color:var(--text);line-height:1.6;white-space:pre}

        .twrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border)}
        table{width:100%;border-collapse:collapse;font-size:.85rem}
        th,td{padding:12px 16px;text-align:left}
        th{background:var(--surface2);font-weight:700;color:#d8d8f0;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px}
        td{background:var(--surface);border-top:1px solid var(--border)}
        tr:hover td{background:var(--surface2)}
        .tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:.73rem;font-weight:600}
        .tbg{background:rgba(0,230,118,.12);color:var(--grn)}
        .thg{background:rgba(124,92,252,.12);color:var(--acc2)}
        .tmo{background:rgba(255,145,0,.12);color:var(--org)}
        .tfs{background:rgba(0,229,255,.12);color:var(--cya)}

        .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
        .fi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;align-items:flex-start;gap:14px;transition:all .2s}
        .fi:hover{border-color:var(--acc);box-shadow:var(--glow)}
        .fi .ic{font-size:1.5rem;flex-shrink:0;margin-top:2px}
        .fi span{font-size:.88rem;line-height:1.5}

        .p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
        .p-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px 18px;text-align:center;transition:all .3s;cursor:default}
        .p-card:hover{border-color:var(--acc);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.4),var(--glow)}
        .p-ic{font-size:2.4rem;margin-bottom:10px}
        .p-nm{font-weight:700;color:#d8d8f0;margin-bottom:4px;font-size:1rem}
        .p-ui{font-size:.78rem;color:var(--text2)}

        .dl-section{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px 28px}
        .dl-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
        .dl-tab{padding:8px 18px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:.83rem;font-weight:600;transition:all .2s;font-family:inherit}
        .dl-tab:hover{border-color:var(--acc);color:#d8d8f0}
        .dl-tab.act{background:linear-gradient(135deg,var(--acc),rgba(124,92,252,.6));border-color:var(--acc);color:#fff}
        .dl-info{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
        .dl-badge{display:inline-block;padding:4px 12px;border-radius:12px;font-size:.73rem;font-weight:700}
        .dl-stable{background:rgba(0,230,118,.15);color:var(--grn)}
        .dl-pre{background:rgba(255,145,0,.15);color:var(--org)}
        .dl-date{color:var(--text2);font-size:.83rem}
        .dl-body{color:var(--text2);font-size:.85rem;margin-bottom:18px;line-height:1.6}
        .dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
        .dl-card{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--text);transition:all .2s}
        .dl-card:hover{border-color:var(--acc);background:rgba(124,92,252,.08);box-shadow:var(--glow);text-decoration:none}
        .dl-card .dlic{font-size:1.5rem;flex-shrink:0}
        .dl-card .dlinfo{flex:1;min-width:0}
        .dl-card .dlnm{font-weight:600;font-size:.83rem;color:#d8d8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .dl-card .dlsz{font-size:.73rem;color:var(--text2)}
        .dl-card .dlarr{color:var(--acc);font-size:1.1rem}
        .dl-all{display:inline-block;margin-top:18px;color:var(--acc2);font-weight:600;font-size:.88rem;text-decoration:none}
        .dl-all:hover{text-decoration:underline}

        .contrib-grid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
        .contrib-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 22px;text-decoration:none;color:var(--text);transition:all .3s;min-width:220px}
        .contrib-card:hover{border-color:var(--acc);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.4),var(--glow);text-decoration:none}
        .contrib-av{width:52px;height:52px;border-radius:50%;border:2px solid var(--border);transition:border-color .3s}
        .contrib-card:hover .contrib-av{border-color:var(--acc)}
        .contrib-info .contrib-nm{font-weight:700;color:#d8d8f0;font-size:.98rem}
        .contrib-info .contrib-cm{font-size:.78rem;color:var(--acc2);font-weight:600}

        .credits-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
        .credit-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;transition:all .3s}
        .credit-card:hover{border-color:var(--acc);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.4),var(--glow)}
        .credit-card h4{font-size:.95rem;margin-bottom:6px}
        .credit-card h4 a{color:var(--acc2);text-decoration:none}
        .credit-card h4 a:hover{text-decoration:underline}
        .credit-card .cby{font-size:.76rem;color:var(--acc2);margin-bottom:8px;font-weight:600}
        .credit-card p{font-size:.83rem;color:var(--text2);line-height:1.5}

        pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px 20px;overflow-x:auto;margin:12px 0;font-size:.8rem}
        code{font-family:'JetBrains Mono','SF Mono','Fira Code',Consolas,monospace;font-size:.8rem;color:#c8c8e0}

        .cta{text-align:center;margin:40px 0}
        .btn{display:inline-block;padding:14px 36px;background:linear-gradient(135deg,var(--acc),#5a3fd4);color:#fff;border-radius:12px;font-weight:700;font-size:1rem;text-decoration:none;transition:all .3s;box-shadow:0 4px 20px rgba(124,92,252,.4);letter-spacing:.3px}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 35px rgba(124,92,252,.6);text-decoration:none}

        footer{margin-top:80px;padding:32px 0;border-top:1px solid var(--border);text-align:center;color:var(--text2);font-size:.83rem;position:relative;z-index:1}
        footer .heart{color:var(--red);animation:pulse 1.5s ease infinite;display:inline-block}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
        footer .license{margin-top:8px}

        a{color:var(--acc2);text-decoration:none;transition:color .2s}
        a:hover{color:#ccc0ff;text-decoration:underline}

        @media(max-width:640px){
            .hero{padding:100px 16px 40px}
            .hero h1{font-size:1.9rem}
            .steps{grid-template-columns:1fr}
            .p-grid{grid-template-columns:1fr 1fr}
            .dl-grid{grid-template-columns:1fr}
            .nav-links{gap:12px}
            .nav-links a{font-size:.78rem}
        }
        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:#3a3a55}

        .skeleton{background:linear-gradient(90deg,var(--surface2) 25%,#1e1e3a 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}                </div>
            </div>
        </section>
