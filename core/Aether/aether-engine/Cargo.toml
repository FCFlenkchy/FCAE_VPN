[package]
name = "aether-engine"
version = "1.9.0"
edition = "2021"
rust-version = "1.91"

[lib]
name = "aether_engine"
path = "src/lib.rs"

[features]
default = []
# Legacy desktop-only path: build the tun2socks *binary* from source, embed it
# in this library and spawn it as a child process at runtime.
#
# OFF by default and unused by the shipping build. tun2socks now runs
# IN-PROCESS via core/fcae-ffi/bridges/tun2socks, which links the Go engine
# directly (c-archive on desktop, c-shared on Android). The fcae runtime also
# forces AETHER_MODE=proxy, so this engine's own TUN paths are never taken.
#
# Kept only so the legacy code still type-checks; do not enable it for
# releases, and do not re-add tun2socks binary packaging to CI.
embedded-tun2socks = []

[dependencies]
# Use core/quiche submodule; workspace for these crates is core/quiche/Cargo.toml
# (not core/Aether/ or repo root — that is why the workspace lives under core/Aether/).
quiche = { path = "../../quiche/quiche", default-features = false, features = ["boringssl-boring-crate", "qlog"] }
boring = "4.22"
foreign-types-shared = "0.3"
libc = "0.2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
base64 = "0.22"
hex = "0.4"
rand = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ring = "0.17"
octets = { path = "../../quiche/octets" }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
futures = "0.3"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
boringtun = "0.7"
x25519-dalek = "2.0.1"
blake2 = "0.10"
chacha20poly1305 = "0.10"
regex = "1"
ipnet = "2"
parking_lot = "0.12"
once_cell = "1"
socket2 = "0.6.4"
h2 = "0.4.15"
http = "1"
bytes = "1"
tokio-boring = "4.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

# Standalone package, deliberately not a member of any workspace.
#
# core/Aether/Cargo.toml used to exist purely to hold aether-ffi and to
# `exclude` this crate. aether-ffi is gone (superseded by core/fcae-ffi), so
# that workspace went with it. This empty table stops the crate from being
# absorbed into an ancestor workspace, which matters because it is consumed as
# a path dependency by core/fcae-ffi/backends/aether and must keep resolving
# against core/quiche's own workspace.
[workspace]
