[package]
name = "fcae-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Backend-agnostic runtime behind the FCAE FFI: config parsing, backend trait, session supervisor, telemetry."

[lib]
name = "fcae_runtime"
path = "src/lib.rs"

[dependencies]
fcae-abi.workspace = true
anyhow.workspace = true
async-trait.workspace = true
log.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tokio.workspace = true
libc.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry"] }
