[package]
name = "fcae-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The FCAE VPN C ABI: the only crate that exports symbols."

[lib]
name = "fcae_ffi"
# The app only links libfcae_ffi.a (CMake). Emitting cdylib + rlib as well
# made rustc codegen the same crate three times; the extra .so/.rlib were
# never packaged. staticlib is the only artifact the native build uses.
crate-type = ["staticlib"]
path = "src/lib.rs"

[features]
default = ["tun"]
# Compile the Aether backend in.
aether = ["dep:fcae-bridge-aether"]
# Compile the Psiphon backend in. On its own this registers the backend so the
# UI can list it, but starting a tunnel reports BackendUnavailable.
psiphon = ["dep:fcae-bridge-psiphon"]
# Native Rust Firefox Accounts, Guardian and Fastly IP Protection backend.
firefox = ["dep:fcae-firefox-bridge"]
# Desktop Psiphon and tun2socks share a single Go archive.
# Android uses the combined Go shared library via psiphon-android.
psiphon-live = ["psiphon", "tun", "fcae-bridge-psiphon/enabled"]
# Android's Java service uses the Psiphon exports from the same Go .so.
psiphon-android = ["psiphon", "tun", "fcae-go-bridge/psiphon"]
# Link the in-process tun2socks bridge.
tun = ["dep:fcae-go-bridge"]
# Link the in-process zeptun bridge. Opt-in (not in `default`): it requires a
# prebuilt libzeptun.a for the target (CI builds one from core/zeptun with
# Zig first; without the archive any consumer can still build with the
# default tun2socks engine only). Compile with
# `fcae-bridge-zeptun/stub` to type-check without the engine.
zeptun = ["dep:fcae-bridge-zeptun"]
# Link the in-process hev-socks5-tunnel bridge. Opt-in (not in `default`): it
# requires a prebuilt libhev-socks5-tunnel.a for the target (CI builds it with
# make first; without the archive any consumer can still build with the
# default tun2socks engine only). Compile with
# `fcae-bridge-hev-socks5-tunnel/stub` to type-check without the engine.
hev = ["dep:fcae-bridge-hev-socks5-tunnel"]
# Xray-core backend. Its Go code is compiled into the same archive as tun2socks
# and Psiphon, which is why this also pulls the Go bridge in.
xray = ["dep:fcae-bridge-xray", "fcae-go-bridge/xray"]
# sing-box backend, in the same archive.
singbox = ["dep:fcae-bridge-singbox", "fcae-go-bridge/singbox"]
# Both extra cores.
cores = ["xray", "singbox"]
# Tor egress inside the Aether engine. OFF by default: it pulls in arti-client
# and a statically built liblzma, which need a C cross-toolchain on the
# Android and Windows-cross runners.
tor = ["aether", "fcae-bridge-aether/tor"]

[dependencies]
fcae-abi.workspace = true
fcae-runtime.workspace = true
fcae-sponsor.workspace = true
fcae-go-bridge = { workspace = true, optional = true }
fcae-bridge-aether = { workspace = true, optional = true }
fcae-bridge-psiphon = { workspace = true, optional = true }
fcae-firefox-bridge = { workspace = true, optional = true }
fcae-bridge-zeptun = { workspace = true, optional = true }
fcae-bridge-hev-socks5-tunnel = { workspace = true, optional = true }
fcae-bridge-xray = { workspace = true, optional = true }
fcae-bridge-singbox = { workspace = true, optional = true }
libc.workspace = true
log.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
serde_json.workspace = true

[build-dependencies]
fcae-build.workspace = true
