[package]
name = "fcae-firefox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Rust Firefox IP Protection engine for FCAE VPN."

[lib]
name = "fcae_firefox"
path = "src/lib.rs"

[dependencies]
aether-engine.workspace = true
async-trait.workspace = true
base64 = "0.22"
boring = "5.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
h2 = "0.4.15"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
httpdate = "1"
httparse = "1"
futures = "0.3"
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
pbkdf2 = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
socket2 = { version = "0.6.4", features = ["all"] }
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-boring = "5.3"
url = "2"
webpki-root-certs = "1.0.11"
zeroize = "1"
