[package]
name = "fcae-bridge-hev-socks5-tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process TUN bridge over hev-socks5-tunnel (C engine, static link)."
links = "hev_socks5_tunnel"

[lib]
name = "fcae_bridge_hev_socks5_tunnel"
path = "src/lib.rs"

[features]
default = []
# Skip the C build and compile a stub that reports the bridge as unavailable.
stub = []

[dependencies]
fcae-runtime.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true

# Windows runs the engine as a child process and owns the interface for it:
# addresses, routes and DNS come from the tun2socks bridge's platform layer, so
# the routing policy exists exactly once. Target-scoped because the sidecar is
# Windows-only, and pulling the Go bridge into, say, an Android build of this
# crate would be pointless work.
[target.'cfg(windows)'.dependencies]
fcae-bridge-tun2socks.workspace = true

[build-dependencies]
fcae-build.workspace = true
