[package]
name = "fcae-bridge-hev-socks5-tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process TUN bridge over hev-socks5-tunnel (C engine, static link or runtime DLL on Windows)."
links = "hev_socks5_tunnel"

[lib]
name = "fcae_bridge_hev_socks5_tunnel"
path = "src/lib.rs"

[features]
default = []
# Skip the C build and compile a stub that reports the bridge as unavailable.
stub = []

[dependencies]
fcae-runtime.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[build-dependencies]
fcae-build.workspace = true
