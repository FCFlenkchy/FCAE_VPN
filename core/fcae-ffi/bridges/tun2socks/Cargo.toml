[package]
name = "fcae-go-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The app's single in-process Go archive: tun2socks, Psiphon, Xray-core and sing-box."
links = "fcae_go_bridge"

[lib]
name = "fcae_bridge_tun2socks"
path = "src/lib.rs"

[features]
default = []
# Skip the Go build and compile a stub that reports the bridge as
# unavailable. Used by CI jobs that only type-check Rust, and by
# `cargo test -p fcae-runtime` runs on machines without a Go toolchain.
stub = []
# Include the Psiphon shim in the same Go archive.
psiphon = []
# Include the Xray-core shim in the same Go archive (Go tag `fcae_xray`).
xray = []
# Include the sing-box shim in the same Go archive (Go tag `fcae_singbox`).
singbox = []

[dependencies]
fcae-runtime.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true

[build-dependencies]
fcae-build.workspace = true
