[package]
name = "fcae-bridge-tun2socks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process tun2socks bridge: links the Go engine as a c-archive, no subprocess on any platform."
links = "tun2socks_bridge"

[lib]
name = "fcae_bridge_tun2socks"
path = "src/lib.rs"

[features]
default = []
# Skip the Go build and compile a stub that reports the bridge as
# unavailable. Used by CI jobs that only type-check Rust, and by
# `cargo test -p fcae-runtime` runs on machines without a Go toolchain.
stub = []

[dependencies]
fcae-abi.workspace = true
fcae-runtime.workspace = true
libc.workspace = true
log.workspace = true
once_cell.workspace = true
parking_lot.workspace = true

[build-dependencies]
fcae-build.workspace = true
