[package]
name = "fcae-bridge-psiphon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Psiphon backend plugin for the FCAE FFI (disabled; Android = official AAR, not tun2socks)."

[lib]
name = "fcae_bridge_psiphon"
path = "src/lib.rs"

[features]
default = []
# Off. Do not compile the Go module. Android uses the official AAR
# (android/psiphon), not a c-shared. Desktop would build go/ with
# force_shared when this is turned on later.
enabled = []

[dependencies]
fcae-abi.workspace = true
fcae-runtime.workspace = true
async-trait.workspace = true
log.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
fcae-build.workspace = true
