[package]
name = "fcae-bridge-psiphon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Psiphon backend plugin for the FCAE FFI."

[lib]
name = "fcae_bridge_psiphon"
path = "src/lib.rs"

[features]
default = []
# Desktop: Psiphon and tun2socks share one Go archive.
enabled = ["dep:fcae-go-bridge", "fcae-go-bridge/psiphon"]

[dependencies]
fcae-abi.workspace = true
fcae-runtime.workspace = true
fcae-go-bridge = { workspace = true, optional = true }
async-trait.workspace = true
log.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
fcae-build.workspace = true
