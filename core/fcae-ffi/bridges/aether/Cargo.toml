[package]
name = "fcae-bridge-aether"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aether (MASQUE/WireGuard/Gool) backend plugin for the FCAE FFI."

[lib]
name = "fcae_bridge_aether"
path = "src/lib.rs"

[features]
default = []
# Forward to the engine's own default-off tor feature. Tor is an egress
# *inside* aether, not a separate fcae-ffi backend, so there is no bridge to
# register -- enabling this only makes the engine's tor.rs compile for real
# instead of returning "this build has no tor support".
tor = ["aether-engine/tor"]

[dependencies]
fcae-abi.workspace = true
fcae-runtime.workspace = true
aether-engine.workspace = true
anyhow.workspace = true
async-trait.workspace = true
log.workspace = true
parking_lot.workspace = true
tokio.workspace = true
