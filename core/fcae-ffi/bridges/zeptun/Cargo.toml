[package]
name = "fcae-bridge-zeptun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process TUN bridge over the zeptun Zig engine (libzeptun C ABI, static link, no subprocess)."
links = "zeptun_bridge"

[lib]
name = "fcae_bridge_zeptun"
path = "src/lib.rs"

[features]
default = []
# Skip the artifact lookup and compile a stub that reports the bridge as
# unavailable. Used by CI jobs that only type-check Rust, and by machines
# without a Zig toolchain / prebuilt libzeptun.
stub = []

[dependencies]
fcae-runtime.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true

[build-dependencies]
fcae-build.workspace = true
