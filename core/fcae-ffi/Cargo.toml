[workspace]
# Global FFI layer for FCAE VPN.
#
# Lives under core/fcae-ffi/ as an isolated workspace so its release profile
# and dependency graph remain independent from the application front ends.
# Aether is consumed through the pinned core/aether submodule, whose crate
# manifest sits at core/aether/aether/Cargo.toml.
members = [
    "abi",
    "runtime",
    "sponsor",
    "ffi",
    "buildtools",
    "bridges/tun2socks",
    "bridges/aether",
    "bridges/psiphon",
    "bridges/zeptun",
    "bridges/hev-socks5-tunnel",
    "bridges/xray",
    "bridges/singbox",
    "bridges/mihomo",
    "firefox",
    "bridges/firefox",
]
exclude = ["../aether/aether"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.91"
license = "GPL-3.0"

[workspace.dependencies]
fcae-abi = { path = "abi" }
fcae-runtime = { path = "runtime" }
fcae-sponsor = { path = "sponsor" }
fcae-build = { path = "buildtools" }
fcae-go-bridge = { path = "bridges/tun2socks" }
fcae-bridge-aether = { path = "bridges/aether" }
fcae-bridge-psiphon = { path = "bridges/psiphon" }
fcae-bridge-zeptun = { path = "bridges/zeptun" }
fcae-bridge-hev-socks5-tunnel = { path = "bridges/hev-socks5-tunnel" }
fcae-bridge-xray = { path = "bridges/xray" }
fcae-bridge-singbox = { path = "bridges/singbox" }
fcae-bridge-mihomo = { path = "bridges/mihomo" }
fcae-firefox-bridge = { path = "bridges/firefox" }
# Nothing of the engine is switched on implicitly. Today its only default is
# `default = []`, so this pins the intent: Tor is asked for by name (the
# `tor` feature of bridges/aether), and Psiphon never -- FCAE links
# tunnel-core itself, so the engine's `psiphon` launcher (which execs an
# external psiphon-tunnel-core, a binary FCAE does not ship) stays unbuilt.
aether-engine = { package = "aether", path = "../aether/aether", default-features = false }


anyhow = "1"
async-trait = "0.1"
libc = "0.2"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
overflow-checks = true
