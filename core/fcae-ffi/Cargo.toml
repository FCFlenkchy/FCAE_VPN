[workspace]
# Global FFI layer for FCAE VPN.
#
# Lives under core/fcae-ffi/ (its own workspace) for the same reason the old
# core/Aether workspace existed: path deps reach into core/quiche, which has
# its own workspace and inherits `edition`/`license` from it. Nesting a
# workspace here keeps those inherits intact.
members = [
    "abi",
    "runtime",
    "ffi",
    "buildtools",
    "bridges/tun2socks",
    "bridges/aether",
    "bridges/psiphon",
]
exclude = ["../Aether", "../quiche"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.91"
license = "GPL-3.0"

[workspace.dependencies]
fcae-abi = { path = "abi" }
fcae-runtime = { path = "runtime" }
fcae-build = { path = "buildtools" }
fcae-bridge-tun2socks = { path = "bridges/tun2socks" }
fcae-bridge-aether = { path = "bridges/aether" }
fcae-bridge-psiphon = { path = "bridges/psiphon" }
aether-engine = { path = "../Aether" }


anyhow = "1"
async-trait = "0.1"
libc = "0.2"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
thiserror = "2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
