[package]
name = "fcae-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared build-script helpers: Go c-archive cross-compilation, wintun staging, target mapping, header generation."

# NOTE: the directory is `buildtools/`, not `build/`, deliberately. A
# top-level `build/` is a conventional artifact directory — it is in most
# global gitignore templates and in many tooling exclusion lists — so a crate
# living there is easy to lose. The crate name stays `fcae-build`.

[lib]
name = "fcae_build"
path = "src/lib.rs"

# Intentionally dependency-free so it never slows down or breaks a build
# script. Everything is done with std + the toolchains already required.
[dependencies]
